<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jon's Trading Desk</title>
<style>
  :root {
    --navy: #001a4d;
    --navy-2: #0a2a6b;
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #101318;
    --muted: #6a7380;
    --line: #d9dee6;
    --up: #0b7a3b;
    --up-bg: #e7f6ec;
    --down: #b42318;
    --chip: #f4f6f8;
    --fill: #d7dee6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 0 18px;
    height: 56px;
    background: var(--navy);
    color: #fff;
    white-space: nowrap;
  }
  .brand b {
    font-size: 15px;
    letter-spacing: 0.12em;
    font-weight: 800;
  }
  .ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 8px 12px;
    font: inherit;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .ghost:hover { background: rgba(255,255,255,0.08); }
  .actions { display: flex; gap: 8px; align-items: center; }
  .status { color: rgba(255,255,255,0.72); font-size: 11px; max-width: 420px; white-space: normal; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  input {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 10px;
    font: inherit;
  }
  #q { width: 220px; }
  select.market-filter {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 10px;
    font: inherit;
    max-width: 280px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .book-inline { color: inherit; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100% - 110px); }
  aside {
    background: var(--card);
    border-right: 1px solid var(--line);
    overflow: auto;
  }
  .game {
    display: grid;
    grid-template-columns: 28px 1fr 28px auto auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .game:hover { background: #f7f9fb; }
  .game.active { background: #eef3fb; box-shadow: inset 3px 0 0 var(--navy); }
  .game img, .logo, .face, td img {
    width: 24px;
    height: 24px;
    max-width: 24px;
    max-height: 24px;
    object-fit: contain;
  }
  .face {
    border-radius: 50%;
    object-fit: cover;
    background: #e8ecf2;
  }
  .game small { display: block; color: var(--muted); font-size: 11px; }
  .count {
    min-width: 22px;
    text-align: center;
    background: var(--up-bg);
    color: var(--up);
    font-weight: 700;
    font-size: 11px;
    padding: 2px 6px;
  }
  main { padding: 12px 14px 28px; min-width: 0; overflow: auto; }
  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 12px 14px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .team { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: 0.03em; }
  .team img { width: 36px; height: 36px; max-width: 36px; max-height: 36px; }
  .mid { text-align: center; color: var(--muted); min-width: 90px; }
  .mid b { display: block; color: var(--navy); font-size: 20px; letter-spacing: 0.04em; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .ev { color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ev.neg { color: var(--down); }
  .src { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
  .book-logo {
    width: 16px;
    height: 16px;
    max-width: 16px;
    max-height: 16px;
    object-fit: contain;
    border-radius: 3px;
    vertical-align: middle;
  }
  .labs-logo {
    width: 22px;
    height: 22px;
    max-width: 22px;
    max-height: 22px;
    object-fit: contain;
    vertical-align: middle;
    background: #0a0a0a;
    border-radius: 4px;
    padding: 1px;
  }
  .book-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-weight: 650;
  }
  .board-wrap {
    background: var(--card);
    border: 1px solid var(--line);
    overflow: auto;
    max-height: calc(100vh - 140px);
  }
  .board {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
  }
  .board th {
    position: sticky;
    top: 0;
    z-index: 2;
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    background: #f3f5f8;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .board th.left, .board td.left { text-align: left; }
  .board th:hover { color: var(--navy); }
  .board th.active { color: var(--navy); }
  .board th .arrow { margin-left: 4px; opacity: 0.75; }
  .board td {
    padding: 8px;
    text-align: right;
    border-bottom: 1px solid #eef1f4;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
    white-space: nowrap;
  }
  .pair {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    line-height: 1.15;
  }
  .pair .px { font-weight: 700; }
  .pair .pc {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
  }
  .pair .pj {
    color: var(--navy);
    font-size: 10px;
    font-weight: 700;
  }
  .board td.left { white-space: normal; }
  .board tr:hover td { background: #f7f9fb; }
  .board tr.clear td { background: #f3faf5; }
  .board tr.clear:hover td { background: #eaf6ee; }
  .board tr[data-key] { cursor: pointer; }
  .board tr.open td { background: #eef3f8; }
  .board tr.book-row td {
    background: #f4f7fb;
    text-align: left;
    white-space: normal;
  }
  .book-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 4px 6px;
  }
  .book-quote {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    padding: 6px 10px;
  }
  .book-quote b { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .book-quote span { color: var(--muted); }
  .form-panel {
    display: grid;
    gap: 10px;
    padding: 4px 4px 8px;
  }
  .form-card {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 14px 10px;
  }
  .form-card h4 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .form-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px 12px;
    margin-bottom: 10px;
  }
  .form-stats div { min-width: 0; }
  .form-stats span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .form-stats b {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .form-chart {
    width: 100%;
    height: 248px;
    display: block;
    background: #f7f9fb;
    border: 1px solid var(--line);
  }
  .form-chart image { pointer-events: none; }
  .form-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
  }
  .form-legend i {
    display: inline-block;
    width: 12px;
    height: 10px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .form-legend .hist { background: #c5ced8; }
  .form-legend .hit { background: #0b7a3b; }
  .form-legend .miss { background: #b42318; opacity: 0.55; }
  .form-legend .model { background: var(--navy); height: 2px; vertical-align: 3px; }
  .form-legend .avg { background: #c47a12; height: 2px; vertical-align: 3px; }
  .form-legend .posted {
    width: 14px;
    height: 0;
    border-top: 2px solid #101318;
    background: transparent;
    vertical-align: 3px;
  }
  .form-legend .line {
    border-left: 2px dotted var(--ink);
    width: 0;
    height: 12px;
    background: transparent;
    vertical-align: -2px;
  }
  @media (max-width: 900px) {
    .form-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .cell-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-main b { display: block; font-size: 13px; }
  .cell-main span { display: block; color: var(--muted); font-size: 11px; }
  .box-link {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 7px;
    cursor: pointer;
  }
  .box-link:hover { background: #eef3fb; }
  .scoreboard .box-link { margin-left: 8px; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px;
    background: rgba(16, 19, 24, 0.45);
    overflow: auto;
  }
  .modal.open { display: flex; }
  .modal-card {
    position: relative;
    width: min(1120px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(0, 26, 77, 0.18);
  }
  .box-x {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    cursor: pointer;
  }
  .box-banner {
    display: grid;
    grid-template-columns: 1fr minmax(220px, auto) 1fr;
    align-items: start;
    gap: 18px;
    height: auto;
    padding: 28px 48px 18px;
    background: #fff;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    white-space: normal;
  }
  .box-id {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    min-width: 0;
  }
  .box-id .logo, .box-id img {
    width: 52px;
    height: 52px;
    max-width: 52px;
    max-height: 52px;
  }
  .box-id b { font-size: 18px; letter-spacing: 0.01em; }
  .box-id i {
    display: block;
    width: 36px;
    height: 3px;
    margin-top: 2px;
  }
  .box-scoreline { text-align: center; min-width: 200px; }
  .box-scoreline small {
    display: block;
    letter-spacing: 0.16em;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
  }
  .box-scoreline b {
    display: block;
    margin: 6px 0 4px;
    font-size: 32px;
    color: var(--navy);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .box-scoreline span { color: var(--muted); font-size: 12px; }
  .box-meta {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: #f4f6f8;
    color: var(--navy);
    font-size: 13px;
    font-weight: 700;
  }
  .box-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .box-col { padding: 14px 18px 18px; min-width: 0; }
  .box-col + .box-col { border-left: 1px solid var(--line); }
  .box-col h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 14px;
  }
  .box-col h3 .logo, .box-col h3 img {
    width: 18px;
    height: 18px;
    max-width: 18px;
    max-height: 18px;
  }
  .box-col .est { margin: 2px 0 8px; color: var(--muted); font-size: 11px; }
  .box-section { margin-top: 12px; }
  .box-section:first-of-type { margin-top: 4px; }
  .box-section h4 {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 800;
  }
  .box-table { width: 100%; border-collapse: collapse; }
  .box-table th, .box-table td {
    padding: 7px 6px;
    text-align: right;
    border-bottom: 1px solid #eef1f4;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .box-table th {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .box-table th.left, .box-table td.left { text-align: left; font-weight: 600; }
  .box-table td.pts { font-weight: 800; }
  .box-injuries {
    margin: 0 18px 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fbfcfe;
  }
  .box-injuries h4 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .box-injuries ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .box-injuries li { font-size: 12px; color: var(--ink); }
  .box-injuries b { font-weight: 700; }
  .box-injuries .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 999px;
    background: #fde8e8;
    color: #9b1c1c;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  @media (max-width: 760px) {
    .box-banner, .box-cols { grid-template-columns: 1fr; }
    .box-col + .box-col { border-left: 0; border-top: 1px solid var(--line); }
    .box-meta { flex-wrap: wrap; gap: 10px 18px; }
  }
  .muted { color: var(--muted); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { max-height: 180px; }
    header { overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>JON'S TRADING DESK</b></div>
  <div class="actions">
    <span class="status" id="status"></span>
    
  </div>
</header>
<div class="toolbar">
  <input id="q" placeholder="Search team, player, market" />
  <div class="chips" id="leagues"></div>
  <div class="chips" id="markets"></div>
  <div class="chips" id="periods"></div>
  <select class="market-filter" id="marketName" aria-label="Market"></select>
  <div class="chips" id="sides"></div>
  <div class="chips" id="lines"></div>
  <div class="chips" id="books"></div>
  <div class="chips" id="views"></div>
</div>
<div class="layout">
  <aside id="games"></aside>
  <main>
    <div id="board"></div>
    <div id="table"></div>
  </main>
</div>
<div id="boxModal" class="modal">
  <div class="modal-card" role="dialog" aria-label="Sim box score">
    <button type="button" class="box-x" id="boxClose">Close</button>
    <div id="boxBody"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const CBB_STATIC = true;
const state = {
  book: null, view: "edges", game: "", league: "cbb", market: "spread", marketName: "all",
  period: "all", side: "all", line: "all", sportsbook: "all", player: "", q: "", clearOnly: false, openKey: "",
  sortKey: "roi", sortDir: "desc",
};
let TEAM_COLORS = {};
const LEAGUE_CHIPS = [
  ["all", "All leagues"],
  ["cbb", "CBB"],
  ["cfb", "CFB"],
  ["nfl", "NFL"],
  ["nba", "NBA"],
];
const MARKET_CHIPS = [
  ["ml", "Moneyline"],
  ["spread", "Spread"],
  ["total", "Total"],
  ["prop", "Player prop"],
];
// Period buckets that exist across sports: FG all leagues; 1H basketball+football; 1Q football+NBA.
const PERIOD_CHIPS = [
  ["all", "All periods"],
  ["fg", "Full Game"],
  ["h1", "1H"],
  ["q1", "1Q"],
];
const SIDE_CHIPS = [
  ["all", "O/U"],
  ["over", "Over"],
  ["under", "Under"],
];
const LINE_CHIPS = [
  ["all", "All lines"],
  ["main", "Main lines"],
];
const VIEW_CHIPS = [
  ["posted", "All posted"],
  ["clear", "Clear edges"],
];
// Shown prices: Sim on modeled markets; Bettor Odds on main props + full-game ML/spread/total.
// No-vig fair is the average of each book's devigged price.
// Expected ROI = P(win) × decimal payout − 1 (Prop Pricing Model).
const BOOKS = {
  onyx: { name: "Onyx", src: "static/books/onyx.png" },
  fliff: { name: "Fliff", src: "static/books/fliff.png" },
  fanatics: { name: "Fanatics", src: "static/books/fanatics.png" },
  draftkings: { name: "DraftKings", src: "static/books/draftkings.png" },
  fanduel: { name: "FanDuel", src: "static/books/fanduel.png" },
  betmgm: { name: "BetMGM", src: "static/books/betmgm.png" },
  caesars: { name: "Caesars", src: "static/books/caesars.png" },
  pinnacle: { name: "Pinnacle", src: "static/books/pinnacle.png" },
  circa: { name: "Circa", src: "static/books/circa.png" },
  novig: { name: "Novig", src: "static/books/novig.png" },
  underdog: { name: "Underdog", src: "static/books/underdog.png" },
};
const BOOK_LOCAL = {
  fliff: "/static/books/fliff.png",
  fanatics: "/static/books/fanatics.png",
  draftkings: "/static/books/draftkings.png",
  fanduel: "/static/books/fanduel.png",
  betmgm: "/static/books/betmgm.png",
  caesars: "/static/books/caesars.png",
  pinnacle: "/static/books/pinnacle.png",
  circa: "/static/books/circa.png",
  novig: "/static/books/novig.png",
  underdog: "/static/books/underdog.png",
  onyx: "/static/books/onyx.png",
};
function rememberBook(row) {
  const key = String((row && row.source) || "");
  if (!key) return;
  const local = BOOK_LOCAL[key] || "";
  const remote = String((row && row.book_mark) || "");
  const name = String((row && (row.book_name || row.venue)) || key);
  if (!BOOKS[key]) {
    BOOKS[key] = { name, src: local || remote };
    return;
  }
  if (!BOOKS[key].src) BOOKS[key].src = local || remote;
  if (local) BOOKS[key].src = local;
  if (name && name !== key) BOOKS[key].name = name;
}
const MARKET_LABELS = {
  pra: "Points + Rebounds + Assists",
  "pts+rebs+asts": "Points + Rebounds + Assists",
  "points rebounds assists": "Points + Rebounds + Assists",
  points_rebounds: "Points + Rebounds",
  "points rebounds": "Points + Rebounds",
  "pts+rebs": "Points + Rebounds",
  points_assists: "Points + Assists",
  "points assists": "Points + Assists",
  "pts+asts": "Points + Assists",
  rebounds_assists: "Rebounds + Assists",
  "rebounds assists": "Rebounds + Assists",
  "rebs+asts": "Rebounds + Assists",
  points: "Points",
  rebounds: "Rebounds",
  assists: "Assists",
  threes: "Three-Pointers Made",
  "3-pt made": "Three-Pointers Made",
  "three pointers made": "Three-Pointers Made",
  steals: "Steals",
  blocks: "Blocked Shots",
  "blocked shots": "Blocked Shots",
  turnovers: "Turnovers",
  double_double: "Double-Double",
  ml: "Moneyline",
  moneyline: "Moneyline",
  spread: "Spread",
  total: "Total",
  "team total": "Team Total",
  "1st half total": "1st Half Total",

  let peak = 0;
  for (let i = 0; i <= n; i++) {
    const x = lo + (hi - lo) * i / n;
    const y = pdf(x);
    xs.push([x, y]);
    if (y > peak) peak = y;
  }
  const X = (x) => padL + (x - lo) / (hi - lo) * (w - padL - padR);
  const Y = (y) => padT + (1 - y / peak) * (h - padT - padB);
  let d = `M ${X(xs[0][0]).toFixed(1)} ${(h - padB).toFixed(1)}`;
  xs.forEach(([x, y]) => { d += ` L ${X(x).toFixed(1)} ${Y(y).toFixed(1)}`; });
  d += ` L ${X(xs[n][0]).toFixed(1)} ${(h - padB).toFixed(1)} Z`;
  const lx = X(line);
  const mx = X(mean);
  const ticks = [];
  const span = hi - lo;
  const step = span > 40 ? 10 : span > 16 ? 5 : span > 8 ? 2 : 1;
  const start = Math.ceil(lo / step) * step;
  for (let t = start; t <= hi + 1e-6; t += step) ticks.push(t);
  const colors = chartColors(bet);
  const gid = "fill-" + String(bet.key || "x").replace(/[^a-z0-9]/gi, "");
  const fill = colors.length >= 2
    ? `url(#${gid})`
    : (colors[0] || "var(--fill)");
  const defs = colors.length >= 2
    ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[1]}" /><stop offset="100%" stop-color="${colors[1]}" /></linearGradient></defs>`
    : "";
  let lineX = lx, meanX = mx;
  let lineAnchor = "middle", meanAnchor = "middle";
  if (Math.abs(mx - lx) < 50) {
    const mid = (lx + mx) / 2;
    lineX = Math.max(padL + 24, mid - 28);
    meanX = Math.min(w - padR - 24, mid + 28);
    lineAnchor = "end";
    meanAnchor = "start";
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${defs}
    <path d="${d}" fill="${fill}" fill-opacity="0.85" />
    <line x1="${lx.toFixed(1)}" y1="${padT}" x2="${lx.toFixed(1)}" y2="${h - padB}" stroke="var(--ink)" stroke-width="1.2" />
    <line x1="${mx.toFixed(1)}" y1="${padT}" x2="${mx.toFixed(1)}" y2="${h - padB}" stroke="var(--navy)" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="${lineX.toFixed(1)}" y="13" text-anchor="${lineAnchor}" fill="var(--ink)" font-size="11">${lineTxt(line)}</text>
    <text x="${meanX.toFixed(1)}" y="13" text-anchor="${meanAnchor}" fill="var(--navy)" font-size="11">${lineTxt(mean)}</text>
    ${ticks.map((t) => `<text x="${X(t).toFixed(1)}" y="${h - 6}" text-anchor="middle" fill="var(--muted)" font-size="11">${lineTxt(t)}</text>`).join("")}
  </svg>`;
}

function formCacheKey(bet) {
  const pick = bet && bet.pick;
  if (!pick || pick.kind !== "prop") return "";
  return [
    rowLeague(pick),
    String(pick.player || "").toLowerCase(),
    propStatFamily(pick),
    String(pick.athlete_id || ""),
  ].join("|");
}

function normalPdf(x, mean, std) {
  const z = (x - mean) / std;
  return Math.exp(-0.5 * z * z) / (std * Math.sqrt(2 * Math.PI));
}

function formGames(form) {
  if (form && Array.isArray(form.games) && form.games.length) {
    return form.games.filter((g) => Number.isFinite(Number(g && g.value)));
  }
  const values = ((form && form.values) || []).map(Number).filter((v) => Number.isFinite(v));
  const dates = (form && form.dates) || [];
  return values.map((value, i) => ({ value, date: dates[i] || "", opp: "", opp_logo: "" }));
}

function formShortDate(text) {
  const raw = String(text || "");
  const week = raw.match(/\bW(?:eek)?\s*(\d+)\b/i);
  if (week) return `Week ${Number(week[1])}`;
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
    return `${Number(raw.slice(5, 7))}/${Number(raw.slice(8, 10))}`;
  }
  return raw;
}

function formAxisCaption(game, league) {
  const g = game || {};
  if (g.week != null && Number.isFinite(Number(g.week))) return `Week ${Number(g.week)}`;
  const label = String(g.label || "");
  if (/^week\s*\d+/i.test(label)) return label.replace(/^week\s*/i, "Week ");
  const fromDate = formShortDate(g.date || label);
  if (/^Week\s+\d+/i.test(fromDate)) return fromDate;
  if (league === "nfl" || league === "cfb") return fromDate || "—";
  return fromDate || "—";
}

function formGuideLabels(guides) {
  /** Keep left-rail labels from stacking on top of each other. */
  const gap = 14;
  const ordered = guides
    .filter((g) => Number.isFinite(g.y))
    .sort((a, b) => a.y - b.y)
    .map((g) => ({ ...g }));
  for (let i = 1; i < ordered.length; i++) {
    if (ordered[i].y - ordered[i - 1].y < gap) {
      ordered[i].y = ordered[i - 1].y + gap;
    }
  }
  return ordered;
}

function formChartSvg(bet, form) {
  const pick = bet.pick || {};
  const mean = Number(bet.mean != null ? bet.mean : pick.model_mean);
  const line = Number(bet.line != null ? bet.line : pick.line);
  const side = sideOf(pick) || bet.side || "over";
  const league = rowLeague(pick);
  const games = formGames(form);
  if (!Number.isFinite(mean) || !Number.isFinite(line)) return "";
  const values = games.map((g) => Number(g.value));
  const histVals = games.map((g) => Number(g.hist_line)).filter((v) => Number.isFinite(v));
  const avg = form && form.avg != null
    ? Number(form.avg)
    : (values.length ? values.reduce((a, b) => a + b, 0) / values.length : null);
  const w = 760, h = 248, padL = 64, padR = 22, padT = 28, padB = 58;
  const sampleHi = values.length
    ? Math.max(...values, line, mean, avg || 0, ...(histVals.length ? histVals : [0]))
    : Math.max(line, mean, ...(histVals.length ? histVals : [0]));
  let hi = Math.max(sampleHi * 1.22, line + 1, mean + 1, 1);
  let lo = 0;
  if (!(hi > lo)) hi = lo + 1;
  const n = Math.max(games.length, 1);
  const slot = (w - padL - padR) / n;
  const barW = Math.max(12, Math.min(34, slot * 0.52));
  const Y = (v) => padT + (1 - (Number(v) - lo) / (hi - lo)) * (h - padT - padB);
  const baseY = h - padB;
  const yLine = Y(line);
  const yMean = Y(mean);
  const yAvg = Number.isFinite(avg) ? Y(avg) : null;
  const guides = formGuideLabels([
    { y: yLine, text: `Line ${lineTxt(line)}`, fill: "#101318", dash: true, stroke: "#101318" },
    { y: yMean, text: `Model ${lineTxt(mean)}`, fill: "#001a4d", dash: false, stroke: "#001a4d" },
    ...(yAvg == null ? [] : [{ y: yAvg, text: `L10 ${lineTxt(avg)}`, fill: "#9a5b00", dash: false, stroke: "#c47a12" }]),
  ]);
  const guideLines = [
    { y: yLine, stroke: "#101318", dash: "5 4", width: 1.4, opacity: 0.55 },
    { y: yMean, stroke: "#001a4d", dash: "", width: 1.5, opacity: 0.55 },
    ...(yAvg == null ? [] : [{ y: yAvg, stroke: "#c47a12", dash: "", width: 1.6, opacity: 0.7 }]),
  ].map((g) => (
    `<line x1="${padL}" y1="${g.y.toFixed(1)}" x2="${(w - padR).toFixed(1)}" y2="${g.y.toFixed(1)}" stroke="${g.stroke}" stroke-width="${g.width}" ${g.dash ? `stroke-dasharray="${g.dash}"` : ""} opacity="${g.opacity}" />`
  )).join("");
  const guideText = guides.map((g) => (
    `<text x="${(padL - 8).toFixed(1)}" y="${(g.y + 3.5).toFixed(1)}" text-anchor="end" fill="${g.fill}" font-size="11" font-weight="700">${escapeHtml(g.text)}</text>`
  )).join("");
  const bars = games.map((g, i) => {
    const value = Number(g.value);
    const hist = Number(g.hist_line);
    const hit = side === "under" ? value < line : value > line;
    const x = padL + slot * i + (slot - barW) / 2;
    const y = Y(Math.max(value, 0));
    const bh = Math.max(3, baseY - y);
    const color = hit ? "#0b7a3b" : "#b42318";
    const cx = x + barW / 2;
    const logo = String(g.opp_logo_cdn || g.opp_logo || "");
    const abbr = String(g.opp || "").slice(0, 4);
    const axis = formAxisCaption(g, league);
    const label = lineTxt(value);
    const labelW = Math.max(18, String(label).length * 7.2 + 8);
    const labelX = cx - labelW / 2;
    const labelY = Math.max(6, y - 18);
    const logoTag = logo
      ? `<image href="${escapeHtml(logo)}" xlink:href="${escapeHtml(logo)}" x="${(cx - 9).toFixed(1)}" y="${(baseY + 5).toFixed(1)}" width="18" height="18" preserveAspectRatio="xMidYMid meet" />`
      : `<text x="${cx.toFixed(1)}" y="${(baseY + 16).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="10" font-weight="700">${escapeHtml(abbr || "—")}</text>`;
    let histMark = "";
    if (Number.isFinite(hist)) {
      const yH = Y(hist);
      const histLabel = lineTxt(hist);
      const tickX1 = x - 1;
      const tickX2 = x + barW + 1;
      // Keep posted-line label clear of the actual-value chip.
      const histTextY = Math.abs(yH - (labelY + 11)) < 14 ? Math.min(baseY - 2, yH + 12) : yH - 4;
      histMark = `<line x1="${tickX1.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${tickX2.toFixed(1)}" y2="${yH.toFixed(1)}" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="${tickX1.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${tickX2.toFixed(1)}" y2="${yH.toFixed(1)}" stroke="#101318" stroke-width="2" stroke-linecap="round" />
      <text x="${cx.toFixed(1)}" y="${histTextY.toFixed(1)}" text-anchor="middle" fill="#3d4654" font-size="9" font-weight="700">${escapeHtml(histLabel)}</text>`;
    }
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" rx="3" />
      ${histMark}
      <rect x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" width="${labelW.toFixed(1)}" height="15" rx="3" fill="#ffffff" stroke="#d9dee6" />
      <text x="${cx.toFixed(1)}" y="${(labelY + 11).toFixed(1)}" text-anchor="middle" fill="#101318" font-size="11" font-weight="700">${escapeHtml(label)}</text>
      ${logoTag}
      <text x="${cx.toFixed(1)}" y="${(baseY + (logo ? 32 : 28)).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="10">${escapeHtml(axis)}</text>`;
  }).join("");
  const empty = games.length
    ? ""
    : `<text x="${(w / 2).toFixed(1)}" y="${(h / 2).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="12">Loading last 10 games…</text>`;
  return `<svg class="form-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Last ${values.length || 10} games vs line">
    <line x1="${padL}" y1="${baseY}" x2="${(w - padR).toFixed(1)}" y2="${baseY}" stroke="#d9dee6" />
    ${guideLines}
    ${bars || empty}
    ${guideText}
  </svg>`;
}

function formPanelHtml(bet, form) {
  const pick = bet.pick || {};
  if (pick.kind !== "prop") return "";
  const mean = Number(bet.mean != null ? bet.mean : pick.model_mean);
  const stdRaw = Number(bet.std != null ? bet.std : pick.model_std);
  const std = Number.isFinite(stdRaw) && stdRaw > 0 ? stdRaw : defaultStd(mean);
  const line = Number(bet.line != null ? bet.line : pick.line);
  const side = sideOf(pick) || bet.side || "over";
  const games = formGames(form);
  const values = games.map((g) => Number(g.value)).filter((v) => Number.isFinite(v));
  const avg = form && form.avg != null
    ? Number(form.avg)
    : (pick.l5_avg != null ? Number(pick.l5_avg) : null);
  let chance = null;
  if (Number.isFinite(mean) && Number.isFinite(std) && Number.isFinite(line)) {
    const overP = 1 - normalCdf(line, mean, std);
    chance = side === "under" ? (1 - overP) : overP;
  } else if (pick.model_prob != null) {
    chance = Number(pick.model_prob);
  }
  const hitN = values.length
    ? values.filter((v) => (side === "under" ? v < line : v > line)).length
    : null;
  const hitRate = hitN == null ? null : hitN / values.length;
  const usualLo = Number.isFinite(mean) && Number.isFinite(std)
    ? Math.max(0, mean - 1.6 * std)
    : (form && form.low);
  const usualHi = Number.isFinite(mean) && Number.isFinite(std)
    ? mean + 1.6 * std
    : (form && form.high);
  const lineLabel = side === "under" ? `${lineTxt(line)} or less` : `${lineTxt(line)} or more`;
  const chart = formChartSvg(bet, form || { values: [], games: [] });
  if (!chart) return "";
  const loading = form == null;
  const nGames = values.length || 10;
  return `<div class="form-card">
    <h4>The model next to last ${nGames} games</h4>
    <div class="form-stats">
      <div><span>Chance of ${escapeHtml(lineLabel)}</span><b>${chance == null ? "—" : Math.round(chance * 100) + "%"}</b></div>
      <div><span>Model expects</span><b>${Number.isFinite(mean) ? lineTxt(mean) : "—"}</b></div>
      <div><span>L10 average</span><b>${avg == null || !Number.isFinite(avg) ? (loading ? "…" : "—") : lineTxt(avg)}</b></div>
      <div><span>Usual range</span><b>${usualLo == null || usualHi == null ? "—" : `${lineTxt(usualLo)}–${lineTxt(usualHi)}`}</b></div>
      <div><span>Hit rate</span><b>${hitRate == null ? (loading ? "…" : "—") : `${Math.round(hitRate * 100)}% (${hitN}/${values.length})`}</b></div>
    </div>
    ${chart}
    <div class="form-legend">
      <span><i class="hit"></i>Hits vs line</span>
      <span><i class="miss"></i>Misses</span>
      <span><i class="posted"></i>Posted that night</span>
      <span><i class="model"></i>Model</span>
      <span><i class="avg"></i>L10 average</span>
      <span><i class="line"></i>Line ${escapeHtml(lineTxt(line))}</span>
    </div>
  </div>`;
}

function caption(bet) {
  if (bet.line == null) return "";
  const sims = 1000;
  if (isSpread(bet)) {
    const coverP = bet.overProb != null ? bet.overProb : (bet.pick && bet.pick.model_prob);
    const coverN = coverP == null ? null : Math.round(coverP * sims);
    const who = teamName(bet.pick) || "this side";
    if (coverN == null) return "";
    const src = fairSource(bet);
    return `<div class="caption">${src} ${who} covers ${signedLine(bet.line)} in ${coverN} of ${sims} · fair ${signedLine(spreadProjLine(bet.mean))}</div>`;
  }
  const overN = bet.overProb == null ? null : Math.round(bet.overProb * sims);
  if (overN == null) return `<div class="caption">Dashed is the fair projection</div>`;
  return `<div class="caption">${fairSource(bet)} over ${lineTxt(bet.line)} in ${overN} of ${sims} · under in ${sims - overN} · dashed is ${lineTxt(bet.mean)}</div>`;
}

function fairSource(bet) {
  const src = bet.pick && bet.pick.price_src;
  if (src === "labs") return "Bettor Odds prices";
  if (src === "evanmiya" || src === "sasser" || src === "nfelo") return "Board prices";
  return "Fair price";
}

function isBettorOddsMarket(quote) {
  /** Main player props + full-game ML / spread / total only. */
  if (!quote) return false;
  const kind = String(quote.kind || "");
  const market = String(quote.market || "").toLowerCase();
  const code = String(quote.market_code || "").toLowerCase();
  const blob = `${market} ${code}`;
  if (/half|1st|2nd|3rd|4th|quarter|\b1q\b|\b2q\b|\b3q\b|\b4q\b/.test(blob)) return false;
  if (/\bsacks?\b|\binterceptions?\b/.test(blob) && kind === "total") return false;
  if (kind === "prop") return !isAltLine(quote);
  if (kind === "ml" || kind === "spread" || kind === "total") {
    if (kind !== "ml" && isAltLine(quote)) return false;
    return true;
  }
  return false;
}

function sideProbs(bet) {
  const pick = bet.pick || {};
  let modelOver = bet.overProb;
  let modelUnder = modelOver == null ? null : 1 - modelOver;
  if (modelOver == null && pick.model_prob != null) {
    const side = sideOf(pick);
    if (side === "under") {
      modelUnder = pick.model_prob;
      modelOver = 1 - pick.model_prob;
    } else {
      modelOver = pick.model_prob;
      modelUnder = 1 - pick.model_prob;
    }
  }
  const bookOver = bet.over ? implied(bet.over.book) : null;
  const bookUnder = bet.under ? implied(bet.under.book) : (pick.book != null && !bet.over ? implied(pick.book) : null);
  const twoSided = bet.over != null || bet.under != null || bet.line != null;
  return {
    twoSided,
    modelOver,
    modelUnder,
    modelOverOdds: americanFromProb(modelOver),
    modelUnderOdds: americanFromProb(modelUnder),
    bookOver,
    bookUnder,
    bookOverOdds: bet.over ? bet.over.book : (twoSided ? null : pick.book),
    bookUnderOdds: bet.under ? bet.under.book : null,
    modelSide: pick.model_prob,
    modelSideOdds: pick.model_odds != null ? pick.model_odds : americanFromProb(pick.model_prob),
    bookSide: implied(pick.book),
    bookSideOdds: pick.book,
  };
}

function winningSide(bet) {
  if (isSpread(bet)) {
    const quote = bestQuote(bet.quotes, (row) => sanePrice(row.book, row.source, row));
    if (quote) return { side: spreadSeat(quote), quote };
    if (bet.pick) return { side: spreadSeat(bet.pick), quote: bet.pick };
    return { side: "", quote: null };
  }
  const overEv = bet.over && bet.over.ev != null ? bet.over.ev : null;
  const underEv = bet.under && bet.under.ev != null ? bet.under.ev : null;
  if (overEv != null && (underEv == null || overEv >= underEv)) {
    return { side: "over", quote: bet.over };
  }
  if (underEv != null) return { side: "under", quote: bet.under };
  const quote = bestQuote(bet.quotes, () => true);
  if (quote) return { side: sideOf(quote), quote };
  if (bet.pick && bet.pick.book != null) return { side: sideOf(bet.pick), quote: bet.pick };
  return { side: "", quote: null };
}

function sameQuote(row, quote) {
  if (!row || !quote) return false;
  return row.source === quote.source
    && row.book === quote.book
    && String(row.line ?? "") === String(quote.line ?? "")
    && sideOf(row) === sideOf(quote)
    && String(row.selection || "") === String(quote.selection || "");
}

function pricedBooks(bet) {
  const sources = new Set();
  (bet.quotes || []).forEach((row) => {
    if (row.book != null && row.source) sources.add(row.source);
  });
  return sources.size;
}

function showBest(bet) {
  return pricedBooks(bet) > 1;
}

function titleOf(bet) {
  const row = bet.pick;
  const market = marketName(row);
  if (row.kind === "prop") {
    return {
      icon: face(rowFace(row)),
      name: row.player || row.selection,
      sub: `${market} · ${row.game}`,
      tag: market,
    };
  }
  if (row.kind === "spread") {
    const seat = spreadSeat(row);
    const team = seat === "home" ? (row.home || teamName(row))
      : seat === "away" ? (row.away || teamName(row))
      : (teamName(row) || row.selection || "");
    const line = row.line == null ? "" : signedLine(row.line);
    return {
      icon: logo(seat === "home" || seat === "away" ? rowLogo(row, seat) : "", team),
      name: line ? `${team} ${line}` : team,
      sub: `${market} · ${row.game}`,
      tag: market,
    };
  }
  if (row.kind === "total") {
    const teamTotal = String(market).toLowerCase().includes("team");
    const team = teamName(row) || String(row.selection || "").replace(/over|under/ig, "").trim();
    const homePick = sameTeam(team, row.home);
    return {
      icon: teamTotal ? logo(rowLogo(row, homePick ? "home" : "away"), team) : "",
      name: teamTotal ? team : (sideOf(row) === "under" ? "Under" : "Over"),
      sub: `${market} · ${row.game}`,
      tag: market,
    };
  }
  const seat = spreadSeat(row);
  const team = seat === "home" ? (row.home || teamName(row))
    : seat === "away" ? (row.away || teamName(row))
    : (teamName(row) || String(row.selection || "").replace(/over|under/ig, "").trim() || row.game);
  return {
    icon: logo(seat === "home" || seat === "away" ? rowLogo(row, seat) : "", team),
    name: team,
    sub: `${market} · ${row.game}`,
    tag: market,
  };
}

function defaultStd(mean) {
  return Math.max(2.0, 1.7 + 0.95 * Math.sqrt(Math.abs(Number(mean) || 0)));
}
function normalCdf(x, mean, std) {
  const z = (Number(x) - Number(mean)) / (Number(std) * Math.SQRT2);
  const t = 1 / (1 + 0.3275911 * Math.abs(z));
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429;
  const erf = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-z * z);
  return 0.5 * (1 + (z < 0 ? -erf : erf));
}
function fairProbAtLine(mean, line, side, spread) {
  if (mean == null || line == null || !Number.isFinite(Number(mean)) || !Number.isFinite(Number(line))) return null;
  const std = defaultStd(mean);
  let p;
  // mean is already oriented to the posted selection for spreads (team margin).
  if (spread) p = 1 - normalCdf(-Number(line), mean, std);
  else if (side === "under") p = normalCdf(Number(line), mean, std);
  else p = 1 - normalCdf(Number(line), mean, std);
  if (!Number.isFinite(p)) return null;
  return Math.min(Math.max(p, 0.01), 0.99);
}
function flatBet(bet) {
  const quote = bet.pick || {};
  const spread = isSpread(bet);
  const title = titleOf(bet);
  const spreadTeam = spread
    ? (() => {
      const seat = spreadSeat(quote);
      if (seat === "home") return quote.home || teamName(quote) || "";
      if (seat === "away") return quote.away || teamName(quote) || "";
      return teamName(quote) || "";
    })()
    : "";
  const side = spread
    ? spreadTeam
    : (sideOf(quote) || bet.side || "");
  const lineNum = bet.line != null ? Number(bet.line) : (quote.line != null ? Number(quote.line) : null);
  const postedLine = quote.line != null ? Number(quote.line) : lineNum;

      const pyds = Number(boxStat(p, "passing_yards"));
      // Hide non-starter QBs that only have residual rush/ATD crumbs.
      if ((pa >= 1.5 || pyds >= 20) && key && key !== starterPassKey) return false;
      return (Number.isFinite(att) ? att : car) >= 1.5 || yds >= 8;
    })
    .sort((a, b) => (Number(boxStat(b, "rushing_yards")) || 0) - (Number(boxStat(a, "rushing_yards")) || 0));
  const receiving = players
    .filter((p) => Number(boxStat(p, "receptions")) >= 1.0 || Number(boxStat(p, "receiving_yards")) >= 8)
    .sort((a, b) => (Number(boxStat(b, "receiving_yards")) || 0) - (Number(boxStat(a, "receiving_yards")) || 0));

  const passRows = passing.map((player) => {
    const out = boxPlayerOut(player, side, injuredKeys);
    return `<tr>
      <td class="left">${boxPlayerLabel(player, out)}</td>
      <td>${boxCmpAtt(player)}</td>
      <td class="pts" style="color:${accent}">${boxNum(boxStat(player, "passing_yards"))}</td>
      <td>${boxNum(boxStat(player, "passing_touchdowns"))}</td>
    </tr>`;
  }).join("");
  const rushRows = rushing.map((player) => {
    const out = boxPlayerOut(player, side, injuredKeys);
    return `<tr>
      <td class="left">${boxPlayerLabel(player, out)}</td>
      <td>${boxRushAtt(player)}</td>
      <td class="pts" style="color:${accent}">${boxNum(boxStat(player, "rushing_yards"))}</td>
      <td>${boxNum(boxStat(player, "rushing_touchdowns"))}</td>
    </tr>`;
  }).join("");
  const recRows = receiving.map((player) => {
    const out = boxPlayerOut(player, side, injuredKeys);
    return `<tr>
      <td class="left">${boxPlayerLabel(player, out)}</td>
      <td>${boxNum(boxStat(player, "receptions"))}</td>
      <td class="pts" style="color:${accent}">${boxNum(boxStat(player, "receiving_yards"))}</td>
      <td>${boxNum(boxStat(player, "receiving_touchdowns"))}</td>
    </tr>`;
  }).join("");

  const body = [
    boxFootballSection("Passing", ["C/ATT", "YDS", "TD"], passRows),
    boxFootballSection("Rushing", ["CAR", "YDS", "TD"], rushRows),
    boxFootballSection("Receiving", ["REC", "YDS", "TD"], recRows),
  ].filter(Boolean).join("") || `<p class="est">No Redzone Labs projections for this side.</p>`;

  return `<section class="box-col">
    <h3>${logo(logoSrc, name)}${escapeHtml(name)}</h3>
    <p class="est">Projected box · sportsbook players · ESPN depth</p>
    ${body}
  </section>`;
}
function boxColumn(name, logoSrc, players, accent, league, injuredKeys) {
  if (isFootballBox(league)) {
    return boxFootballColumn(name, logoSrc, players, accent, injuredKeys);
  }
  const cols = boxStatsFor(league);
  const side = players.length && players[0].side ? players[0].side : "";
  const rows = players.slice().sort((a, b) => {
    const aUse = Number(a.mpg);
    const bUse = Number(b.mpg);
    if (Number.isFinite(aUse) || Number.isFinite(bUse)) return (bUse || 0) - (aUse || 0);
    const sum = (p) => cols.reduce((n, [key]) => n + (Number(boxStat(p, key)) || 0), 0);
    return sum(b) - sum(a);
  });
  const highlight = "points";
  const body = rows.map((player) => {
    const out = boxPlayerOut(player, side, injuredKeys);
    return `<tr>
    <td class="left">${boxPlayerLabel(player, out)}</td>
    ${cols.map(([key]) => {
      const value = boxNum(boxStat(player, key));
      return key === highlight
        ? `<td class="pts" style="color:${accent}">${value}</td>`
        : `<td>${value}</td>`;
    }).join("")}
  </tr>`;
  }).join("");
  return `<section class="box-col">
    <h3>${logo(logoSrc, name)}${escapeHtml(name)}</h3>
    <p class="est">Projected box · this game</p>
    <table class="box-table">
      <thead><tr><th class="left">Player</th>${cols.map(([, label]) => `<th>${label}</th>`).join("")}</tr></thead>
      <tbody>${body || `<tr><td class="left">No projected rotation</td></tr>`}</tbody>
    </table>
  </section>`;
}
function boxInjuries(injuries, awayName, homeName) {
  const rows = (injuries || []).slice().sort((a, b) => {
    const side = String(a.side || "").localeCompare(String(b.side || ""));
    if (side) return side;
    return String(a.player || "").localeCompare(String(b.player || ""));
  });
  if (!rows.length) return "";
  return `<div class="box-injuries"><h4>Injuries / outs</h4><ul>${rows.map((row) => {
    const team = row.side === "home" ? homeName : (row.side === "away" ? awayName : (row.team || ""));
    const status = String(row.status || "Out");
    return `<li><b>${escapeHtml(boxShort(row.player))}</b> <span>${escapeHtml(team || "")}</span><span class="tag">${escapeHtml(status)}</span></li>`;
  }).join("")}</ul></div>`;
}
function boxSidePoints(players) {
  return players.reduce((sum, player) => {
    const pts = Number(boxStat(player, "points"));
    return sum + (Number.isFinite(pts) ? pts : 0);
  }, 0);
}
function boxHtml(payload, desk) {
  const game = (payload && payload.game) || {};
  const players = (payload && payload.players) || [];
  const injuries = (payload && payload.injuries) || [];
  const league = (payload && payload.league) || game.league || (desk && desk.league) || "cbb";
  const awayName = game.away || (desk && desk.away) || "Away";
  const homeName = game.home || (desk && desk.home) || "Home";
  // Keep outs in the box when they still have a projection — the box *is* the
  // projection, so dropping them made the banner disagree with the table.
  const injuredKeys = new Set(injuries.map((row) => `${String(row.player || "").toLowerCase()}|${row.side || ""}`));
  const away = players.filter((player) => player.side === "away");
  const home = players.filter((player) => player.side === "home");
  const awayBox = boxSidePoints(away);
  const homeBox = boxSidePoints(home);
  const awayScore = awayBox > 0.5 ? awayBox : (desk && desk.sim_away != null ? desk.sim_away : game.sim_away_pts);
  const homeScore = homeBox > 0.5 ? homeBox : (desk && desk.sim_home != null ? desk.sim_home : game.sim_home_pts);
  const spread = boxSpread(homeName, awayName, game.fair_home_spread);
  const total = boxNum(game.fair_total);
  const poss = boxNum(game.exp_possessions);
  const stadium = String(game.stadium || game.venue || "").trim();
  const weather = String(game.weather_description || "").trim() || (() => {
    if (league !== "nfl" && league !== "cfb") return "";
    const roof = String(game.weather_roof || "").toLowerCase();
    if (roof === "dome" || roof === "closed" || roof === "indoor") return "Indoor";
    const bits = [];
    const cond = String(game.weather_condition || "").trim();
    if (cond && !/^\d+$/.test(cond)) bits.push(cond);
    const temp = Number(game.weather_temp_f);
    if (Number.isFinite(temp)) bits.push(`${Math.round(temp)} F`);
    const wind = Number(game.weather_wind_mph);
    if (Number.isFinite(wind) && wind >= 1) bits.push(`Wind ${Math.round(wind)} mph`);
    return bits.join(" | ");
  })();
  const meta = [
    spread,
    total ? `Total ${total}` : "",
    poss && league !== "cfb" && league !== "nfl" ? `${poss} possessions` : "",
    stadium || "",
    weather || "",
  ].filter(Boolean);
  return `<div class="box-banner">
      <div class="box-id">${logo(desk && desk.away_logo, awayName)}<b>${escapeHtml(awayName)}</b><i style="background:${boxAccent(desk, "away")}"></i></div>
      <div class="box-scoreline">
        <small>Projected score</small>
        <b>${boxNum(awayScore) || "–"} – ${boxNum(homeScore) || "–"}</b>
        <span>${escapeHtml(boxWhen(desk, game))}</span>
      </div>
      <div class="box-id">${logo(desk && desk.home_logo, homeName)}<b>${escapeHtml(homeName)}</b><i style="background:${boxAccent(desk, "home")}"></i></div>
    </div>
    ${meta.length ? `<div class="box-meta">${meta.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}</div>` : ""}
    ${boxInjuries(injuries, awayName, homeName)}
    <div class="box-cols">
      ${boxColumn(awayName, desk && desk.away_logo, away, boxAccent(desk, "away"), league, injuredKeys)}
      ${boxColumn(homeName, desk && desk.home_logo, home, boxAccent(desk, "home"), league, injuredKeys)}
    </div>`;
}
function boxPayloadFromBoard(id, desk) {
  /** Build a sim box from preloaded board rows (GitHub Pages / static desk). */
  const rows = ((state.book && state.book.rows) || []).filter((row) => {
    const gid = String(row.sim_id || row.game_id || row.game || "");
    const matchId = String(id || "");
    if (gid && (gid === matchId || String(row.sim_id || "") === matchId)) return true;
    if (desk && row.away === desk.away && row.home === desk.home) return true;
    return false;
  });
  const byPlayer = new Map();
  for (const row of rows) {
    if (row.kind !== "prop" || !row.player) continue;
    const side = row.side === "home" || row.side === "away"
      ? row.side
      : (desk && row.team === desk.home ? "home" : (desk && row.team === desk.away ? "away" : ""));
    const key = `${String(row.player).toLowerCase()}|${side}`;
    let player = byPlayer.get(key);
    if (!player) {
      player = {
        player: row.player,
        team: row.team || (side === "home" ? (desk && desk.home) : (desk && desk.away)) || "",
        side,
        mpg: row.proj_mpg != null ? row.proj_mpg : null,
        stats: {},
      };
      byPlayer.set(key, player);
    }
    const family = propStatFamily(row) || row.market || "";
    if (!family || family === "other") continue;
    const mean = row.sim_mean != null ? row.sim_mean : row.model_mean;
    if (mean == null || !Number.isFinite(Number(mean))) continue;
    if (!player.stats[family]) player.stats[family] = { mean: Number(mean) };
    if (row.proj_mpg != null && player.mpg == null) player.mpg = row.proj_mpg;
  }
  const players = Array.from(byPlayer.values());
  if (!players.length && !(desk && (desk.sim_away != null || desk.sim_home != null))) return null;
  return {
    game: {
      id,
      league: (desk && desk.league) || "cbb",
      away: (desk && desk.away) || "",
      home: (desk && desk.home) || "",
      game_date: (desk && desk.start) || "",
      sim_away_pts: desk && desk.sim_away,
      sim_home_pts: desk && desk.sim_home,
      fair_home_spread: desk && desk.fair_home_spread,
      fair_total: desk && desk.fair_total,
    },
    league: (desk && desk.league) || "cbb",
    players,
    injuries: [],
    markets: {},
  };
}
async function openBox(id) {
  const modal = $("boxModal");
  const desk = ((state.book && state.book.games) || []).find((game) => (game.id || game.game) === id);
  $("boxBody").innerHTML = `<div class="empty">Loading the sim box score…</div>`;
  modal.classList.add("open");
  try {
    if (CBB_STATIC) {
      const payload = boxPayloadFromBoard(id, desk);
      if (!payload) throw new Error("missing");
      boxCache[id] = payload;
      $("boxBody").innerHTML = boxHtml(payload, desk);
      return;
    }
    // Always refetch — props/sim can move under the board without a hard reload.
    const response = await fetch("/api/game/" + encodeURIComponent(id) + "?t=" + Date.now());
    if (!response.ok) throw new Error("missing");
    boxCache[id] = await response.json();
    $("boxBody").innerHTML = boxHtml(boxCache[id], desk);
  } catch (err) {
    // Last resort: synthesize from whatever is already on the board.
    const fallback = boxPayloadFromBoard(id, desk);
    if (fallback) {
      boxCache[id] = fallback;
      $("boxBody").innerHTML = boxHtml(fallback, desk);
      return;
    }
    $("boxBody").innerHTML = `<div class="empty">No sim box score for this game.</div>`;
  }
}
function render() {
  chips("leagues", LEAGUE_CHIPS, "league");
  chips("markets", MARKET_CHIPS, "market");
  chips("periods", periodChipItems(), "period");
  fillMarketFilter();
  chips("sides", SIDE_CHIPS, "side");
  chips("lines", LINE_CHIPS, "line");
  chips("books", bookChipItems(), "sportsbook");
  $("views").innerHTML = VIEW_CHIPS.map(([value, label]) =>
    `<button class="chip${(state.clearOnly ? "clear" : "posted") === value ? " active" : ""}" data-clear="${value}">${label}</button>`
  ).join("");
  $("views").querySelectorAll(".chip").forEach((btn) => btn.onclick = () => {
    state.clearOnly = btn.dataset.clear === "clear";
    render();
  });
  const list = bets();
  const games = (state.book && state.book.games) || [];
  const selected = state.game ? games.find((g) => g.id === state.game || g.game === state.game) : null;
  renderGames();
  $("board").innerHTML = selected ? scoreboard(selected) : "";
  $("board").querySelectorAll("[data-box]").forEach((btn) => btn.onclick = () => openBox(btn.dataset.box));
  $("table").innerHTML = tableFor(list);
  $("table").querySelectorAll("th[data-sort]").forEach((th) => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else {
        state.sortKey = key;
        state.sortDir = (key === "game" || key === "name" || key === "side") ? "asc" : "desc";
      }
      render();
    };
  });
  $("table").querySelectorAll("tr[data-key]").forEach((tr) => {
    tr.onclick = () => {
      const key = tr.getAttribute("data-key");
      state.openKey = state.openKey === key ? "" : key;
      render();
      if (state.openKey) loadPropForm(state.openKey);
    };
  });
}

async function loadPropForm(openKey) {
  const list = bets();
  const row = list.find((bet) => encodeURIComponent(bet.key || "") === openKey);
  if (!row || !row.pick || row.pick.kind !== "prop") return;
  const cacheKey = formCacheKey(row);
  if (!cacheKey) return;
  const cached = formCache[cacheKey];
  // Retry empty caches — earlier failed fetches used to stick forever.
  if (cached && ((cached.games && cached.games.length) || (cached.values && cached.values.length))) return;
  const pick = row.pick;
  const params = new URLSearchParams({
    league: rowLeague(pick),
    player: pick.player || "",
    market: propStatFamily(pick) || pick.market || "",
    athlete_id: pick.athlete_id || "",
    n: "10",
  });
  try {
    const response = await fetch("/api/desk/prop-form?" + params.toString());
    const payload = response.ok ? await response.json() : { values: [], games: [] };
    formCache[cacheKey] = payload;
  } catch (err) {
    delete formCache[cacheKey];
  }
  if (state.openKey === openKey) render();
}

$("q").oninput = () => { state.q = $("q").value; render(); };
$("boxClose").onclick = () => $("boxModal").classList.remove("open");
$("boxModal").onclick = (event) => {
  if (event.target.id === "boxModal") $("boxModal").classList.remove("open");
};
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") $("boxModal").classList.remove("open");
});

const _edgesCache = {};
function staticEdgesUrl(league) {
  const lg = String(league || "cbb").toLowerCase();
  if (lg === "all") return "edges_all.json";
  if (lg === "cbb") return "edges.json"; // tiny first-paint core (no props)
  return `edges_${lg}.json`;
}
function staticPropsUrl(league) {
  const lg = String(league || "cbb").toLowerCase();
  if (lg === "all") return "";
  return `edges_${lg}_props.json`;
}
async function mergeStaticProps(league, body) {
  if (!CBB_STATIC || !body || !body.props_pending) return body;
  const url = staticPropsUrl(league);
  if (!url) return body;
  try {
    const response = await fetch(url, { cache: "force-cache" });
    if (!response.ok) return body;
    const props = await response.json();
    const merged = {
      ...body,
      rows: (body.rows || []).concat(props.rows || []),
      props_pending: false,
    };
    merged.markets = (merged.rows || []).length;
    merged.clear_edges = (merged.rows || []).filter((r) => r.clear).length;
    return merged;
  } catch (err) {
    return body;
  }
}
async function fetchEdges(league, { withProps = false } = {}) {
  const lg = String(league || "cbb").toLowerCase();
  const cacheKey = withProps ? `${lg}+props` : lg;
  if (_edgesCache[cacheKey]) return _edgesCache[cacheKey];
  if (withProps && _edgesCache[lg] && !_edgesCache[lg].props_pending) {
    _edgesCache[cacheKey] = _edgesCache[lg];
    return _edgesCache[lg];
  }
  const url = CBB_STATIC
    ? staticEdgesUrl(lg)
    : `/api/desk/edges?league=${encodeURIComponent(lg)}`;
  const response = await fetch(url, { cache: CBB_STATIC ? "force-cache" : "no-cache" });
  if (!response.ok) throw new Error(`edges ${response.status}`);
  let body = await response.json();
  if (CBB_STATIC && (withProps || state.market === "prop")) {
    body = await mergeStaticProps(lg, body);
  }
  _edgesCache[lg] = body;
  if (!body.props_pending) _edgesCache[`${lg}+props`] = body;
  return body;
}
async function ensurePropsLoaded() {
  if (!CBB_STATIC || !state.book || !state.book.props_pending) return false;
  const league = state.league || "cbb";
  const body = await mergeStaticProps(league, state.book);
  if (body === state.book || body.props_pending) return false;
  state.book = body;
  _edgesCache[league] = body;
  _edgesCache[`${league}+props`] = body;
  return true;
}
function prefetchStaticLeagues(active) {
  if (!CBB_STATIC) return;
  const run = () => {
    // Warm props for the active league, then other league cores.
    ensurePropsLoaded().then((changed) => { if (changed) render(); }).catch(() => {});
    ["cbb", "cfb", "nfl", "nba"].filter((lg) => lg !== active).forEach((lg) => {
      fetchEdges(lg).catch(() => {});
    });
  };
  if (typeof requestIdleCallback === "function") requestIdleCallback(run, { timeout: 1800 });
  else setTimeout(run, 400);
}
async function load() {
  $("table").innerHTML = `<div class="empty">Loading the board…</div>`;
  const league = state.league || "cbb";
  const colorsUrl = CBB_STATIC ? "static/team_colors.json" : "/static/team_colors.json";
  // Parallel: colors are tiny and optional; don't block the board on them.
  const colorsP = fetch(colorsUrl)
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  try {
    const needProps = state.market === "prop";
    const [colors, body] = await Promise.all([colorsP, fetchEdges(league, { withProps: needProps })]);
    TEAM_COLORS = colors || {};
    state.book = body;
  } catch (err) {
    TEAM_COLORS = await colorsP;
    $("status").textContent = "Board failed to load. Pull to refresh.";
    $("table").innerHTML = `<div class="empty">Could not load odds for ${String(league).toUpperCase()}.</div>`;
    return;
  }
  const n = (state.book.rows || []).length;
  const tag = league === "all" ? "all leagues" : String(league).toUpperCase();
  $("status").textContent = state.book.error
    ? state.book.error
    : `${n} prices · ${(state.book.games || []).length} games · ${tag}`;
  render();
  prefetchStaticLeagues(league);
}

$("marketName").onchange = () => {
  // Stay on the active kind chip (Moneyline / Spread / Total / Player prop).
  state.marketName = $("marketName").value;
  if (!["ml", "spread", "total", "prop"].includes(state.market)) state.market = "spread";
  render();
};

async function applyBoard(body, tag) {
  state.book = body || state.book;
  const n = ((state.book && state.book.rows) || []).length;
  const games = ((state.book && state.book.games) || []).length;
  const label = tag || (state.league === "all" ? "all leagues" : String(state.league || "cbb").toUpperCase());
  $("status").textContent = (state.book && state.book.error)
    ? state.book.error
    : `${n} prices · ${games} games · ${label}`;
  render();
}

async function softReload() {
  // Static Pages board is a snapshot — no live poll.
  if (CBB_STATIC) return;
  // Light poll: drop tipped games + restore logos without a full book pull.
  try {
    const league = state.league || "cbb";
    delete _edgesCache[league];
    await applyBoard(await fetchEdges(league));
  } catch (err) {
    /* keep last board */
  }
}

if (CBB_STATIC) {
  const refresh = $("refresh");
  if (refresh) refresh.remove();
} else if ($("refresh")) {
  $("refresh").onclick = async () => {
    $("refresh").disabled = true;
    $("refresh").textContent = "Refreshing…";
    $("status").textContent = "Pulling PrizePicks, Kalshi, Polymarket, Underdog, Novig, Onyx, Pick6…";
    try {
      throw new Error("Live refresh runs on the local desk");
      const body = await response.json();
      await applyBoard(body);
    } catch (err) {
      $("status").textContent = "Refresh failed. The last board is still up.";
    } finally {
      $("refresh").disabled = false;
      $("refresh").textContent = "Refresh odds";
    }
  };
  // Every 2 minutes: cull live/final games and keep rail logos in sync.
  setInterval(softReload, 2 * 60 * 1000);
}
load();
</script>
