<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jon's Trading Desk</title>
<style>
  :root {
    --navy: #001a4d;
    --navy-2: #0a2a6b;
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #101318;
    --muted: #6a7380;
    --line: #d9dee6;
    --up: #0b7a3b;
    --up-bg: #e7f6ec;
    --down: #b42318;
    --chip: #f4f6f8;
    --fill: #d7dee6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 0 18px;
    height: 56px;
    background: var(--navy);
    color: #fff;
    white-space: nowrap;
  }
  .brand b {
    font-size: 15px;
    letter-spacing: 0.12em;
    font-weight: 800;
  }
  .ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 8px 12px;
    font: inherit;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .ghost:hover { background: rgba(255,255,255,0.08); }
  .actions { display: flex; gap: 8px; align-items: center; }
  .status { color: rgba(255,255,255,0.72); font-size: 11px; max-width: 420px; white-space: normal; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  input {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 10px;
    font: inherit;
  }
  #q { width: 220px; }
  select.market-filter {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 10px;
    font: inherit;
    max-width: 280px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .book-inline { color: inherit; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100% - 110px); }
  aside {
    background: var(--card);
    border-right: 1px solid var(--line);
    overflow: auto;
  }
  .game {
    display: grid;
    grid-template-columns: 28px 1fr 28px auto auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .game:hover { background: #f7f9fb; }
  .game.active { background: #eef3fb; box-shadow: inset 3px 0 0 var(--navy); }
  .game img, .logo, .face, td img {
    width: 24px;
    height: 24px;
    max-width: 24px;
    max-height: 24px;
    object-fit: contain;
  }
  .face {
    border-radius: 50%;
    object-fit: cover;
    background: #e8ecf2;
  }
  .game small { display: block; color: var(--muted); font-size: 11px; }
  .count {
    min-width: 22px;
    text-align: center;
    background: var(--up-bg);
    color: var(--up);
    font-weight: 700;
    font-size: 11px;
    padding: 2px 6px;
  }
  main { padding: 12px 14px 28px; min-width: 0; overflow: auto; }
  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 12px 14px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .team { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: 0.03em; }
  .team img { width: 36px; height: 36px; max-width: 36px; max-height: 36px; }
  .mid { text-align: center; color: var(--muted); min-width: 90px; }
  .mid b { display: block; color: var(--navy); font-size: 20px; letter-spacing: 0.04em; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .ev { color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ev.neg { color: var(--down); }
  .src { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
  .book-logo {
    width: 16px;
    height: 16px;
    max-width: 16px;
    max-height: 16px;
    object-fit: contain;
    border-radius: 3px;
    vertical-align: middle;
  }
  .labs-logo {
    width: 22px;
    height: 22px;
    max-width: 22px;
    max-height: 22px;
    object-fit: contain;
    vertical-align: middle;
    background: #0a0a0a;
    border-radius: 4px;
    padding: 1px;
  }
  .miya-col {
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .book-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-weight: 650;
  }
  .board-wrap {
    background: var(--card);
    border: 1px solid var(--line);
    overflow: auto;
    max-height: calc(100vh - 140px);
  }
  .board {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
  }
  .board th {
    position: sticky;
    top: 0;
    z-index: 2;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    background: #f3f5f8;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .board th.left, .board td.left { text-align: left; }
  .board th:hover { color: var(--navy); }
  .board th.active { color: var(--navy); }
  .board th .arrow { margin-left: 4px; opacity: 0.75; }
  .board td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #eef1f4;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
    white-space: nowrap;
  }
  .pair {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1.15;
  }
  .pair .px { font-weight: 700; }
  .pair .pc {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
  }
  .pair .pj {
    color: var(--navy);
    font-size: 10px;
    font-weight: 700;
  }
  .board td.left { white-space: normal; }
  .board tr:hover td { background: #f7f9fb; }
  .board tr.clear td { background: #f3faf5; }
  .board tr.clear:hover td { background: #eaf6ee; }
  .board tr[data-key] { cursor: pointer; }
  .board tr.open td { background: #eef3f8; }
  .board tr.book-row td {
    background: #f4f7fb;
    text-align: left;
    white-space: normal;
  }
  .book-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 4px 6px;
  }
  .book-quote {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    padding: 6px 10px;
  }
  .book-quote b { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .book-quote span { color: var(--muted); }
  /* Books-only shopping strip — one compact line, best price highlighted. */
  .board tr.books-only td { background: #fafbfc; }
  .board tr.books-only:hover td { background: #f3f6f9; }
  .board tr.book-row.shop-row td {
    background: #fafbfc;
    padding: 0 8px 10px;
    border-bottom: 1px solid #e8ecf1;
  }
  .shop-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 6px;
    padding: 2px 0 0;
  }
  .shop-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 64px;
    padding: 6px 8px 5px;
    background: #fff;
    border: 1px solid #e2e7ee;
    border-radius: 6px;
  }
  .shop-chip .shop-logo {
    width: 16px;
    height: 16px;
    object-fit: contain;
  }
  .shop-chip .shop-name {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    line-height: 1;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .shop-chip .shop-line {
    font-size: 9px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
  }
  .shop-chip b {
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1;
  }
  .shop-chip.best {
    border-color: #1f6b3a;
    background: #f3faf5;
  }
  .shop-chip.best b { color: #1f6b3a; }
  .shop-chip.alt-line {
    border-style: dashed;
    opacity: 0.92;
  }
  .shop-empty {
    color: var(--muted);
    font-size: 11px;
    padding: 4px 0;
  }
  .form-panel {
    display: grid;
    gap: 10px;
    padding: 4px 4px 8px;
  }
  .form-card {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 14px 10px;
  }
  .form-card h4 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .form-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px 12px;
    margin-bottom: 10px;
  }
  .form-stats div { min-width: 0; }
  .form-stats span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .form-stats b {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .form-chart {
    width: 100%;
    height: 272px;
    display: block;
    background: #f7f9fb;
    border: 1px solid var(--line);
  }
  .form-chart image { pointer-events: none; }
  .book-quote .book-inline { margin-right: 2px; }
  .form-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
  }
  .form-legend i {
    display: inline-block;
    width: 12px;
    height: 10px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .form-legend .hist { background: #c5ced8; }
  .form-legend .hit { background: #0b7a3b; }
  .form-legend .miss { background: #b42318; opacity: 0.55; }
  .form-legend .model { background: var(--navy); height: 2px; vertical-align: 3px; }
  .form-legend .avg { background: #c47a12; height: 2px; vertical-align: 3px; }
  .form-legend .posted {
    width: 14px;
    height: 0;
    border-top: 2px solid #101318;
    background: transparent;
    vertical-align: 3px;
  }
  .slip {
    position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100vw - 24px));
    max-height: min(70vh, 560px); overflow: auto; z-index: 40;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18); padding: 12px 14px;
  }
  .slip h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  .slip .slip-leg {
    display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start;
    padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .slip .slip-leg:first-of-type { border-top: 0; }
  .slip .slip-leg b { display: block; }
  .slip .slip-leg span { color: var(--muted); font-size: 12px; }
  .slip .slip-x {
    border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1;
  }
  .slip .slip-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px;
  }
  .slip .slip-meta div span { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
  .slip .slip-meta div b { font-size: 16px; }
  .slip .slip-meta .mult-hi { color: #0b7a3b; }
  .slip .slip-meta .mult-lo { color: #b42318; }
  .slip .slip-actions { display: flex; gap: 8px; margin-top: 10px; }
  .slip .slip-actions button { flex: 1; }
  .slip .slip-err { color: #b42318; font-size: 12px; margin-top: 6px; }
  .slip .slip-hint { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  tr.slip-on td { background: color-mix(in srgb, var(--navy) 10%, transparent); }
  .form-legend .line {
    border-left: 2px dotted var(--ink);
    width: 0;
    height: 12px;
    background: transparent;
    vertical-align: -2px;
  }
  @media (max-width: 900px) {
    .form-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .cell-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-main b { display: block; font-size: 13px; }
  .cell-main span { display: block; color: var(--muted); font-size: 11px; }
  .box-link {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 7px;
    cursor: pointer;
  }
  .box-link:hover { background: #eef3fb; }
  .scoreboard .box-link { margin-left: 8px; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px;
    background: rgba(16, 19, 24, 0.45);
    overflow: auto;
  }
  .modal.open { display: flex; }
  .modal-card {
    position: relative;
    width: min(1120px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(0, 26, 77, 0.18);
  }
  .box-x {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    cursor: pointer;
  }
  .box-banner {
    display: grid;
    grid-template-columns: 1fr minmax(220px, auto) 1fr;
    align-items: start;
    gap: 18px;
    height: auto;
    padding: 28px 48px 18px;
    background: #fff;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    white-space: normal;
  }
  .box-id {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    min-width: 0;
  }
  .box-id .logo, .box-id img {
    width: 52px;
    height: 52px;
    max-width: 52px;
    max-height: 52px;
  }
  .box-id b { font-size: 18px; letter-spacing: 0.01em; }
  .box-id i {
    display: block;
    width: 36px;
    height: 3px;
    margin-top: 2px;
  }
  .box-scoreline { text-align: center; min-width: 200px; }
  .box-scoreline small {
    display: block;
    letter-spacing: 0.16em;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
  }
  .box-scoreline b {
    display: block;
    margin: 6px 0 4px;
    font-size: 32px;
    color: var(--navy);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .box-scoreline span { color: var(--muted); font-size: 12px; }
  .box-meta {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: #f4f6f8;
    color: var(--navy);
    font-size: 13px;
    font-weight: 700;
  }
  .box-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .box-col { padding: 14px 18px 18px; min-width: 0; }
  .box-col + .box-col { border-left: 1px solid var(--line); }
  .box-col h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 14px;
  }
  .box-col h3 .logo, .box-col h3 img {
    width: 18px;
    height: 18px;
    max-width: 18px;
    max-height: 18px;
  }
  .box-col .est { margin: 2px 0 8px; color: var(--muted); font-size: 11px; }
  .box-section { margin-top: 12px; }
  .box-section:first-of-type { margin-top: 4px; }
  .box-section h4 {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 800;
  }
  .box-table { width: 100%; border-collapse: collapse; }
  .box-table th, .box-table td {
    padding: 7px 6px;
    text-align: right;
    border-bottom: 1px solid #eef1f4;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .box-table th {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .box-table th.left, .box-table td.left { text-align: left; font-weight: 600; }
  .box-table td.pts { font-weight: 800; color: var(--ink); }
  .box-injuries {
    margin: 0 18px 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fbfcfe;
  }
  .box-injuries h4 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .box-injuries ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .box-injuries li { font-size: 12px; color: var(--ink); }
  .box-injuries b { font-weight: 700; }
  .box-injuries .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 999px;
    background: #fde8e8;
    color: #9b1c1c;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  @media (max-width: 760px) {
    .box-banner, .box-cols { grid-template-columns: 1fr; }
    .box-col + .box-col { border-left: 0; border-top: 1px solid var(--line); }
    .box-meta { flex-wrap: wrap; gap: 10px 18px; }
  }
  .muted { color: var(--muted); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { max-height: 180px; }
    header { overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>JON'S TRADING DESK</b></div>
  <div class="actions">
    <span class="status" id="status"></span>
    
  </div>
</header>
<div class="toolbar">
  <input id="q" placeholder="Search team, player, market" />
  <div class="chips" id="leagues"></div>
  <div class="chips" id="markets"></div>
  <div class="chips" id="periods"></div>
  <select class="market-filter" id="marketName" aria-label="Market"></select>
  <div class="chips" id="sides"></div>
  <div class="chips" id="lines"></div>
  <div class="chips" id="books"></div>
  <div class="chips" id="views"></div>
</div>
<div class="layout">
  <aside id="games"></aside>
  <main>
    <div id="board"></div>
    <div id="table"></div>
  </main>
</div>
<div id="boxModal" class="modal">
  <div class="modal-card" role="dialog" aria-label="Sim box score">
    <button type="button" class="box-x" id="boxClose">Close</button>
    <div id="boxBody"></div>
  </div>
</div>
<div id="slip" class="slip" hidden>
  <h3>Same-game parlay</h3>
  <p class="slip-hint">Alt-click a row to add a leg. Fair price uses joint sim correlation (PredictQ-style).</p>
  <div id="slipLegs"></div>
  <div class="slip-meta" id="slipMeta" hidden></div>
  <div class="slip-err" id="slipErr" hidden></div>
  <div class="slip-actions">

    else if (sameTeam(row.player_team || row.team, row.away)) tid = row.away_id;
  } else if (kind === "ml" || kind === "spread" || /team/i.test(market)) {
    const sel = String(row.selection || "") + " " + String(row.player_team || row.team || "");
    if (sameTeam(sel, row.home)) tid = row.home_id;
    else if (sameTeam(sel, row.away)) tid = row.away_id;
  }
  const one = hexColor(tid);
  return one ? [one] : both;
}
function density(bet) {
  if (isSpread(bet) || isMoneyline(bet)) return "";
  const mean = bet.mean, std = bet.std, line = bet.line;
  if (mean == null || std == null || std <= 0 || line == null) return "";
  const w = 720, h = 132, padL = 6, padR = 6, padT = 18, padB = 22;
  const lo = Math.min(Math.max(0, mean - 3.5 * std), line - 0.8 * std);
  const hi = Math.max(mean + 3.5 * std, line + 0.8 * std);
  const n = 96;
  const pdf = (x) => {
    const z = (x - mean) / std;
    return Math.exp(-0.5 * z * z);
  };
  const xs = [];
  let peak = 0;
  for (let i = 0; i <= n; i++) {
    const x = lo + (hi - lo) * i / n;
    const y = pdf(x);
    xs.push([x, y]);
    if (y > peak) peak = y;
  }
  const X = (x) => padL + (x - lo) / (hi - lo) * (w - padL - padR);
  const Y = (y) => padT + (1 - y / peak) * (h - padT - padB);
  let d = `M ${X(xs[0][0]).toFixed(1)} ${(h - padB).toFixed(1)}`;
  xs.forEach(([x, y]) => { d += ` L ${X(x).toFixed(1)} ${Y(y).toFixed(1)}`; });
  d += ` L ${X(xs[n][0]).toFixed(1)} ${(h - padB).toFixed(1)} Z`;
  const lx = X(line);
  const mx = X(mean);
  const ticks = [];
  const span = hi - lo;
  const step = span > 40 ? 10 : span > 16 ? 5 : span > 8 ? 2 : 1;
  const start = Math.ceil(lo / step) * step;
  for (let t = start; t <= hi + 1e-6; t += step) ticks.push(t);
  const colors = chartColors(bet);
  const gid = "fill-" + String(bet.key || "x").replace(/[^a-z0-9]/gi, "");
  const fill = colors.length >= 2
    ? `url(#${gid})`
    : (colors[0] || "var(--fill)");
  const defs = colors.length >= 2
    ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[1]}" /><stop offset="100%" stop-color="${colors[1]}" /></linearGradient></defs>`
    : "";
  let lineX = lx, meanX = mx;
  let lineAnchor = "middle", meanAnchor = "middle";
  if (Math.abs(mx - lx) < 50) {
    const mid = (lx + mx) / 2;
    lineX = Math.max(padL + 24, mid - 28);
    meanX = Math.min(w - padR - 24, mid + 28);
    lineAnchor = "end";
    meanAnchor = "start";
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${defs}
    <path d="${d}" fill="${fill}" fill-opacity="0.85" />
    <line x1="${lx.toFixed(1)}" y1="${padT}" x2="${lx.toFixed(1)}" y2="${h - padB}" stroke="var(--ink)" stroke-width="1.2" />
    <line x1="${mx.toFixed(1)}" y1="${padT}" x2="${mx.toFixed(1)}" y2="${h - padB}" stroke="var(--navy)" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="${lineX.toFixed(1)}" y="13" text-anchor="${lineAnchor}" fill="var(--ink)" font-size="11">${lineTxt(line)}</text>
    <text x="${meanX.toFixed(1)}" y="13" text-anchor="${meanAnchor}" fill="var(--navy)" font-size="11">${lineTxt(mean)}</text>
    ${ticks.map((t) => `<text x="${X(t).toFixed(1)}" y="${h - 6}" text-anchor="middle" fill="var(--muted)" font-size="11">${lineTxt(t)}</text>`).join("")}
  </svg>`;
}

function formCacheKey(bet) {
  const pick = bet && bet.pick;

    rowLeague(pick),

function normalPdf(x, mean, std) {
  const z = (x - mean) / std;
  return Math.exp(-0.5 * z * z) / (std * Math.sqrt(2 * Math.PI));
}

function formGames(form) {
  if (form && Array.isArray(form.games) && form.games.length) {
    return form.games.filter((g) => Number.isFinite(Number(g && g.value)));
  }
  const values = ((form && form.values) || []).map(Number).filter((v) => Number.isFinite(v));
  const dates = (form && form.dates) || [];
  return values.map((value, i) => ({ value, date: dates[i] || "", opp: "", opp_logo: "" }));
}

function formShortDate(text) {
  const raw = String(text || "");
  const week = raw.match(/\bW(?:eek)?\s*(\d+)\b/i);
  if (week) return `Week ${Number(week[1])}`;
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
    return `${Number(raw.slice(5, 7))}/${Number(raw.slice(8, 10))}`;
  }
  return raw;
}

function formAxisCaption(game, league) {
  const g = game || {};
  if (g.week != null && Number.isFinite(Number(g.week))) return `Week ${Number(g.week)}`;
  const label = String(g.label || "");
  if (/^week\s*\d+/i.test(label)) return label.replace(/^week\s*/i, "Week ");
  const fromDate = formShortDate(g.date || label);
  if (/^Week\s+\d+/i.test(fromDate)) return fromDate;
  if (league === "nfl" || league === "cfb") return fromDate || "—";
  return fromDate || "—";
}

function formGuideLabels(guides) {
  /** Keep left-rail labels from stacking on top of each other. */
  const gap = 14;
  const ordered = guides
    .filter((g) => Number.isFinite(g.y))
    .sort((a, b) => a.y - b.y)
    .map((g) => ({ ...g }));
  for (let i = 1; i < ordered.length; i++) {
    if (ordered[i].y - ordered[i - 1].y < gap) {
      ordered[i].y = ordered[i - 1].y + gap;
    }
  }
  return ordered;
}

function formChartSvg(bet, form) {

  const values = games.map((g) => Number(g.value));

  const avg = form && form.avg != null
    ? Number(form.avg)

         <text x="${cx.toFixed(1)}" y="${(baseY + 38).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="9">${escapeHtml(abbr || axis || "")}</text>`
      : `<text x="${cx.toFixed(1)}" y="${(baseY + 16).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="10" font-weight="700">${escapeHtml(abbr || "—")}</text>
         <text x="${cx.toFixed(1)}" y="${(baseY + 30).toFixed(1)}" text-anchor="middle" fill="#6a7380" font-size="10">${escapeHtml(axis)}</text>`;
    let histMark = "";

      histMark = `<line x1="${tickX1.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${tickX2.toFixed(1)}" y2="${yH.toFixed(1)}" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

function formPanelHtml(bet, form) {
  const pick = bet.pick || {};
  if (pick.kind !== "prop") return "";
  const mean = Number(bet.mean != null ? bet.mean : pick.model_mean);
  const stdRaw = Number(bet.std != null ? bet.std : pick.model_std);
  const std = Number.isFinite(stdRaw) && stdRaw > 0 ? stdRaw : defaultStd(mean);
  const line = Number(bet.line != null ? bet.line : pick.line);
  const side = sideOf(pick) || bet.side || "over";
  const games = formGames(form);
  const values = games.map((g) => Number(g.value)).filter((v) => Number.isFinite(v));
  const avg = form && form.avg != null
    ? Number(form.avg)
    : (pick.l5_avg != null ? Number(pick.l5_avg) : null);
  let chance = null;
  if (Number.isFinite(mean) && Number.isFinite(std) && Number.isFinite(line)) {
    const overP = 1 - normalCdf(line, mean, std);
    chance = side === "under" ? (1 - overP) : overP;
  } else if (pick.model_prob != null) {
    chance = Number(pick.model_prob);
  }
  const hitN = values.length
    ? values.filter((v) => (side === "under" ? v < line : v > line)).length
    : null;
  const hitRate = hitN == null ? null : hitN / values.length;
  const usualLo = Number.isFinite(mean) && Number.isFinite(std)
    ? Math.max(0, mean - 1.6 * std)
    : (form && form.low);
  const usualHi = Number.isFinite(mean) && Number.isFinite(std)
    ? mean + 1.6 * std
    : (form && form.high);
  const lineLabel = side === "under" ? `${lineTxt(line)} or less` : `${lineTxt(line)} or more`;
  const chart = formChartSvg(bet, form || { values: [], games: [] });
  if (!chart) return "";
  const loading = form == null;
  const nGames = values.length || 10;
  return `<div class="form-card">
    <h4>The model next to last ${nGames} games</h4>
    <div class="form-stats">
      <div><span>Chance of ${escapeHtml(lineLabel)}</span><b>${chance == null ? "—" : Math.round(chance * 100) + "%"}</b></div>
      <div><span>Model expects</span><b>${Number.isFinite(mean) ? lineTxt(mean) : "—"}</b></div>
      <div><span>L10 average</span><b>${avg == null || !Number.isFinite(avg) ? (loading ? "…" : "—") : lineTxt(avg)}</b></div>
      <div><span>Usual range</span><b>${usualLo == null || usualHi == null ? "—" : `${lineTxt(usualLo)}–${lineTxt(usualHi)}`}</b></div>
      <div><span>Hit rate</span><b>${hitRate == null ? (loading ? "…" : "—") : `${Math.round(hitRate * 100)}% (${hitN}/${values.length})`}</b></div>
    </div>
    ${chart}
    <div class="form-legend">
      <span><i class="hit"></i>Hits vs line</span>
      <span><i class="miss"></i>Misses</span>
      <span><i class="posted"></i>Posted that night</span>
      <span><i class="model"></i>Model</span>
      <span><i class="avg"></i>L10 average</span>
      <span><i class="line"></i>Line ${escapeHtml(lineTxt(line))}</span>
    </div>
  </div>`;
}

function caption(bet) {
  if (bet.line == null) return "";
  const sims = 1000;
  if (isSpread(bet)) {
    const coverP = bet.overProb != null ? bet.overProb : (bet.pick && bet.pick.model_prob);
    const coverN = coverP == null ? null : Math.round(coverP * sims);
    const who = teamName(bet.pick) || "this side";
    if (coverN == null) return "";
    const src = fairSource(bet);
    return `<div class="caption">${src} ${who} covers ${signedLine(bet.line)} in ${coverN} of ${sims} · fair ${signedLine(spreadProjLine(bet.mean))}</div>`;
  }
  const overN = bet.overProb == null ? null : Math.round(bet.overProb * sims);
  if (overN == null) return `<div class="caption">Dashed is the fair projection</div>`;
  return `<div class="caption">${fairSource(bet)} over ${lineTxt(bet.line)} in ${overN} of ${sims} · under in ${sims - overN} · dashed is ${lineTxt(bet.mean)}</div>`;
}

function fairSource(bet) {
  const src = bet.pick && bet.pick.price_src;
  if (src === "labs") return "Bettor Odds prices";
  if (src === "evanmiya" || src === "sasser" || src === "nfelo" || src === "arkndjl" || src === "ours") return "Board prices";
  return "Fair price";
}

function isBooksOnlyMarket(quote) {
  /** Anytime TD / tackles+AST / sacks / team sacks / team TDs / punts / 1Q. */
  if (!quote) return false;
  if (quote.books_only === true || quote.books_only === 1 || quote.books_only === "true") return true;
  if (propPeriod(quote) === "q1") return true;
  const market = String(quote.market || "").toLowerCase();
  const code = String(quote.market_code || "").toLowerCase();
  const sel = String(quote.selection || "").toLowerCase();
  const blob = `${market} ${code} ${sel}`;
  if (/\b1st[_\s]?quarter\b|first[_\s]?quarter|\bq1\b|\b1q\b/.test(blob)) return true;
  if (/\bsacks?\b|\bpunts?\b/.test(blob)) return true;
  if (/tackles?|solo[_\s]?tackles?|tackles?[_\s]?assists?|assisted[_\s]?tackles?/.test(blob)) return true;
  if (/\bteam[_\s]?touchdowns?\b|\bteam[_\s]?tds?\b|\bteamtds\b|\bttd\b/.test(blob)) return true;
  if (/anytime[_\s]?(td|tds|touchdown)|touchdown[_\s]?scorer|\bto[_\s]?score\b|player[_\s]?touchdowns\b/.test(blob)) {
    if (/pass\w*[_\s]?td|rush\w*[_\s]?td|rec\w*[_\s]?td|receiv\w*[_\s]?td/.test(blob) && !/anytime|scorer/.test(blob)) {
      return false;
    }
    return true;
  }
  return false;
}
function isBettorOddsMarket(quote) {
  /** Player props (any posted line) + full-game ML / spread / total (main + alt). */
  if (!quote) return false;
  if (isBooksOnlyMarket(quote)) return false;
  const kind = String(quote.kind || "");
  const market = String(quote.market || "").toLowerCase();
  const code = String(quote.market_code || "").toLowerCase();
  const blob = `${market} ${code}`;
  if (/half|1st|2nd|3rd|4th|quarter|\b1q\b|\b2q\b|\b3q\b|\b4q\b/.test(blob)) return false;
  if (/\bsacks?\b|\binterceptions?\b/.test(blob) && kind === "total") return false;
  // Show Bettor Odds on every prop ladder rung when Labs has a mean — not only
  // the consensus main — so the column isn't blank on Pick6/UD-style lines.
  if (kind === "prop") return true;
  if (kind === "ml" || kind === "spread" || kind === "total") return true;
  return false;
}

function sideProbs(bet) {
  const pick = bet.pick || {};
  let modelOver = bet.overProb;
  let modelUnder = modelOver == null ? null : 1 - modelOver;
  if (modelOver == null && pick.model_prob != null) {
    const side = sideOf(pick);
    if (side === "under") {
      modelUnder = pick.model_prob;
      modelOver = 1 - pick.model_prob;
    } else {
      modelOver = pick.model_prob;
      modelUnder = 1 - pick.model_prob;
    }
  }
  const bookOver = bet.over ? implied(bet.over.book) : null;
  const bookUnder = bet.under ? implied(bet.under.book) : (pick.book != null && !bet.over ? implied(pick.book) : null);
  const twoSided = bet.over != null || bet.under != null || bet.line != null;
  return {
    twoSided,
    modelOver,
    modelUnder,
    modelOverOdds: americanFromProb(modelOver),
    modelUnderOdds: americanFromProb(modelUnder),
    bookOver,
    bookUnder,
    bookOverOdds: bet.over ? bet.over.book : (twoSided ? null : pick.book),
    bookUnderOdds: bet.under ? bet.under.book : null,
    modelSide: pick.model_prob,
    modelSideOdds: pick.model_odds != null ? pick.model_odds : americanFromProb(pick.model_prob),
    bookSide: implied(pick.book),
    bookSideOdds: pick.book,
  };
}

function winningSide(bet) {
  if (isSpread(bet)) {
    const quote = bestQuote(bet.quotes, (row) => sanePrice(row.book, row.source, row));
    if (quote) return { side: spreadSeat(quote), quote };
    if (bet.pick) return { side: spreadSeat(bet.pick), quote: bet.pick };
    return { side: "", quote: null };
  }
  const overEv = bet.over && bet.over.ev != null ? bet.over.ev : null;
  const underEv = bet.under && bet.under.ev != null ? bet.under.ev : null;
  if (overEv != null && (underEv == null || overEv >= underEv)) {
    return { side: "over", quote: bet.over };
  }
  if (underEv != null) return { side: "under", quote: bet.under };
  const quote = bestQuote(bet.quotes, () => true);
  if (quote) return { side: sideOf(quote), quote };
  if (bet.pick && bet.pick.book != null) return { side: sideOf(bet.pick), quote: bet.pick };
  return { side: "", quote: null };
}

function sameQuote(row, quote) {
  if (!row || !quote) return false;
  return row.source === quote.source
    && row.book === quote.book
    && String(row.line ?? "") === String(quote.line ?? "")
    && sideOf(row) === sideOf(quote)
    && String(row.selection || "") === String(quote.selection || "");
}

function pricedBooks(bet) {
  const sources = new Set();
  (bet.quotes || []).forEach((row) => {
    if (row.book != null && row.source) sources.add(row.source);
  });
  return sources.size;
}

function showBest(bet) {
  return pricedBooks(bet) > 1;
}

function fullTeamName(row, seat) {

function boxPayloadFromBoard(id, desk) {
  /** Build a sim box from preloaded board rows (GitHub Pages / static desk). */
  const rows = ((state.book && state.book.rows) || []).filter((row) => {
    const gid = String(row.sim_id || row.game_id || row.game || "");
    const matchId = String(id || "");
    if (gid && (gid === matchId || String(row.sim_id || "") === matchId)) return true;
    if (desk && row.away === desk.away && row.home === desk.home) return true;
    return false;
  });
  const byPlayer = new Map();
  for (const row of rows) {
    if (row.kind !== "prop" || !row.player) continue;
    const teamTok = row.team || row.player_team || "";
    const side = row.side === "home" || row.side === "away"
      ? row.side
      : (desk && sameTeam(teamTok, desk.home) ? "home"
        : (desk && sameTeam(teamTok, desk.away) ? "away" : ""));
    if (!side) continue;
    const teamName = side === "home" ? (desk && desk.home) : (desk && desk.away);
    const key = `${String(row.player).toLowerCase()}|${side}`;
    let player = byPlayer.get(key);
    if (!player) {
      const mpg0 = row.proj_mpg != null ? Number(row.proj_mpg)
        : (row.xmin != null ? Number(row.xmin) : null);
      player = {
        player: row.player,
        team: teamName || teamTok || "",
        side,
        mpg: Number.isFinite(mpg0) ? mpg0 : null,
        stats: {},
      };
      byPlayer.set(key, player);
    }
    const family = propStatFamily(row) || row.market || "";
    if (!family || family === "other") continue;
    const mean = row.sim_mean != null ? row.sim_mean : row.model_mean;
    if (mean == null || !Number.isFinite(Number(mean))) continue;
    if (!player.stats[family]) player.stats[family] = { mean: Number(mean) };
    const mpg = row.proj_mpg != null ? Number(row.proj_mpg)
      : (row.xmin != null ? Number(row.xmin) : null);
    if (Number.isFinite(mpg) && mpg > 0 && !(Number(player.mpg) > 0)) player.mpg = mpg;
  }
  const players = Array.from(byPlayer.values());
  if (!players.length && !(desk && (desk.sim_away != null || desk.sim_home != null))) return null;
  return {
    game: {
      id,
      league: (desk && desk.league) || "cbb",
      away: (desk && desk.away) || "",
      home: (desk && desk.home) || "",
      away_id: (desk && desk.away_id) || "",
      home_id: (desk && desk.home_id) || "",
      away_logo: (desk && desk.away_logo) || "",
      home_logo: (desk && desk.home_logo) || "",
      game_date: (desk && desk.start) || "",
      sim_away_pts: desk && desk.sim_away,
      sim_home_pts: desk && desk.sim_home,
      fair_home_spread: desk && desk.fair_home_spread,
      fair_total: desk && desk.fair_total,

async function openBox(id) {
  const modal = $("boxModal");
  const desk = ((state.book && state.book.games) || []).find((game) => String(game.id || game.game) === String(id));
  $("boxBody").innerHTML = `<div class="empty">Loading the sim box score…</div>`;
  modal.classList.add("open");
  // Never reuse a prior payload — resims / injury flips must show immediately.
  delete boxCache[id];
  try {
    if (CBB_STATIC) {
      const payload = boxPayloadFromBoard(id, desk);
      if (!payload) throw new Error("missing");
      boxCache[id] = payload;
      $("boxBody").innerHTML = boxHtml(payload, desk);
      return;
    }
    // Slim box payload skips 100MB+ player-ladder CSVs the table never renders.
    const response = await fetch("/api/game/" + encodeURIComponent(id) + "?box=1&t=" + Date.now(), {
      cache: "no-store",
    });
    if (!response.ok) throw new Error("missing");
    boxCache[id] = await response.json();
    $("boxBody").innerHTML = boxHtml(boxCache[id], desk);
  } catch (err) {
    // Last resort: synthesize from whatever is already on the board.
    const fallback = boxPayloadFromBoard(id, desk);
    if (fallback) {
      boxCache[id] = fallback;
      $("boxBody").innerHTML = boxHtml(fallback, desk);
      return;
    }
    $("boxBody").innerHTML = `<div class="empty">No sim box score for this game.</div>`;
  }
}

    line,
    prob: Number.isFinite(prob) ? prob : null,
    label: `${bet.name || pick.selection || pick.player || kind} · ${bet.lineTxt || ((bet.sideTxt || side) + (line != null ? " " + line : ""))}`,
    game: String(pick.game || ""),
  };
}

function toggleSlipLeg(bet) {
  const leg = slipLegFromBet(bet);
  if (!leg) {
    $("slipErr").hidden = false;
    $("slipErr").textContent = "Need a sim-linked quote (sim_id) to price this leg.";
    $("slip").hidden = false;
    return;
  }
  if (state.slip.length && (state.slip[0].game_id !== leg.game_id || state.slip[0].league !== leg.league)) {
    state.slip = [];
  }
  const idx = state.slip.findIndex((row) => row.key === leg.key);
  if (idx >= 0) state.slip.splice(idx, 1);
  else {
    if (state.slip.length >= 8) return;
    state.slip.push(leg);
  }
  state.slipQuote = null;
  render();
}

function renderSlip() {
  const panel = $("slip");
  if (!panel) return;
  if (!state.slip.length) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;
  $("slipLegs").innerHTML = state.slip.map((leg, i) => `
    <div class="slip-leg">
      <div><b>${escapeHtml(leg.label)}</b><span>${escapeHtml(leg.game || "")} · ${escapeHtml(String(leg.league || "").toUpperCase())}</span></div>
      <button type="button" class="slip-x" data-slip-i="${i}" aria-label="Remove">×</button>
    </div>`).join("");
  $("slipLegs").querySelectorAll("[data-slip-i]").forEach((btn) => {
    btn.onclick = () => {
      state.slip.splice(Number(btn.dataset.slipI), 1);
      state.slipQuote = null;
      render();
    };
  });
  const quote = state.slipQuote;
  const meta = $("slipMeta");
  const err = $("slipErr");
  if (quote && quote.ok) {
    err.hidden = true;
    meta.hidden = false;
    const mult = quote.multiplier;
    const multClass = mult == null ? "" : (mult >= 1.05 ? "mult-hi" : (mult <= 0.95 ? "mult-lo" : ""));
    const hist = quote.hist_multiplier;
    const arch = quote.hist_archetype ? String(quote.hist_archetype).replace(/_/g, " ") : "";
    meta.innerHTML = `
      <div><span>Fair combo</span><b>${odds(quote.fair_american)}</b> · ${(100 * quote.joint_p).toFixed(1)}¢</div>
      <div><span>Independence</span><b>${odds(quote.indep_american)}</b> · ${(100 * quote.indep_p).toFixed(1)}¢</div>
      <div><span>Multiplier</span><b class="${multClass}">${mult == null ? "—" : mult.toFixed(2) + "×"}</b></div>
      <div><span>History${arch ? " · " + escapeHtml(arch) : ""}</span><b>${hist == null ? "—" : Number(hist).toFixed(2) + "×"}</b> <span style="font-size:11px;color:var(--muted)">${quote.hist_n ? "n=" + quote.hist_n : ""}</span></div>`;
  } else {
    meta.hidden = true;
    if (quote && quote.error) {
      err.hidden = false;
      err.textContent = quote.error;
    } else {
      err.hidden = true;
    }
  }
}

async function priceSlip() {
  if (state.slip.length < 2) {
    state.slipQuote = { ok: false, error: "Add at least two legs from the same game." };
    renderSlip();
    return;
  }
  const first = state.slip[0];
  $("slipErr").hidden = false;
  $("slipErr").textContent = "Pricing…";
  try {
    const response = await fetch("/api/desk/parlay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        league: first.league,
        game_id: first.game_id,
        sims: 20000,
        legs: state.slip.map((leg) => ({
          kind: leg.kind,
          side: leg.side,
          line: leg.line,
          player: leg.player,
          team: leg.team,
          stat: leg.stat,
          market: leg.market,
          prob: leg.prob,
          label: leg.label,
        })),
      }),
    });
    state.slipQuote = await response.json();
  } catch (exc) {
    state.slipQuote = { ok: false, error: String(exc || "parlay failed") };
  }
  renderSlip();
}

async function loadPropForm(openKey) {
  const list = bets();
  const row = list.find((bet) => encodeURIComponent(bet.key || "") === openKey);
  if (!row || !row.pick || row.pick.kind !== "prop") return;
  const cacheKey = formCacheKey(row);
  if (!cacheKey) return;
  const cached = formCache[cacheKey];
  // Retry empty caches — earlier failed fetches used to stick forever.
  if (cached && ((cached.games && cached.games.length) || (cached.values && cached.values.length))) return;
  const pick = row.pick;
  const params = new URLSearchParams({
    league: rowLeague(pick),
    player: pick.player || "",
    market: propStatFamily(pick) || pick.market || "",
    athlete_id: pick.athlete_id || "",
    period: propPeriod(pick) || "fg",
    n: "10",
  });
  try {
    const response = await fetch("/api/desk/prop-form?" + params.toString());
    const payload = response.ok ? await response.json() : { values: [], games: [] };
    formCache[cacheKey] = payload;
  } catch (err) {
    delete formCache[cacheKey];
  }
  if (state.openKey === openKey) render();
}

$("q").oninput = () => { state.q = $("q").value; render(); };
$("boxClose").onclick = () => $("boxModal").classList.remove("open");
$("boxModal").onclick = (event) => {
  if (event.target.id === "boxModal") $("boxModal").classList.remove("open");
};
$("slipClear").onclick = () => {
  state.slip = [];
  state.slipQuote = null;
  render();
};
$("slipPrice").onclick = () => { priceSlip(); };
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") $("boxModal").classList.remove("open");
});

const _edgesCache = {};
function assetV() {
  return (typeof CBB_ASSET_V === "string" && CBB_ASSET_V) ? `?v=${CBB_ASSET_V}` : "";
}
function staticEdgesUrl(league) {
  const lg = String(league || "cbb").toLowerCase();
  const q = assetV();
  if (lg === "all") return `edges_all.json${q}`;
  if (lg === "cbb") return `edges.json${q}`; // tiny first-paint core (no props)
  return `edges_${lg}.json${q}`;
}
function staticPropsUrl(league) {
  const lg = String(league || "cbb").toLowerCase();
  if (lg === "all") return "";
  return `edges_${lg}_props.json${assetV()}`;
}
async function mergeStaticProps(league, body) {
  if (!CBB_STATIC || !body || !body.props_pending) return body;
  const url = staticPropsUrl(league);
  if (!url) return body;
  try {
    const response = await fetch(url, { cache: "force-cache" });
    if (!response.ok) return body;
    const props = await response.json();
    const merged = {
      ...body,
      rows: (body.rows || []).concat(props.rows || []),
      props_pending: false,
    };
    merged.markets = (merged.rows || []).length;
    merged.clear_edges = (merged.rows || []).filter((r) => r.clear).length;
    return merged;
  } catch (err) {
    return body;
  }
}
async function fetchEdges(league, { withProps = false } = {}) {
  const lg = String(league || "cbb").toLowerCase();
  const wantProps = withProps || state.market === "prop";
  const cacheKey = wantProps ? `${lg}+props` : lg;
  if (_edgesCache[cacheKey]) return _edgesCache[cacheKey];
  if (wantProps && _edgesCache[lg] && !_edgesCache[lg].props_pending) {
    _edgesCache[cacheKey] = _edgesCache[lg];
    return _edgesCache[lg];
  }
  const url = CBB_STATIC
    ? staticEdgesUrl(lg)
    : `/api/desk/edges?league=${encodeURIComponent(lg)}${wantProps ? "&props=1" : ""}`;
  const response = await fetch(url, { cache: CBB_STATIC ? "force-cache" : "no-cache" });
  if (!response.ok) throw new Error(`edges ${response.status}`);
  let body = trimBoardBooks(await response.json());
  if (CBB_STATIC && (wantProps || state.market === "prop")) {
    body = trimBoardBooks(await mergeStaticProps(lg, body));
  }
  if (wantProps) {
    _edgesCache[`${lg}+props`] = body;
    _edgesCache[lg] = body;
  } else {
    _edgesCache[lg] = body;
  }
  return body;
}
async function ensurePropsLoaded() {
  if (!CBB_STATIC || !state.book || !state.book.props_pending) return false;
  const league = state.league || "cbb";
  const body = await mergeStaticProps(league, state.book);
  if (body === state.book || body.props_pending) return false;
  state.book = trimBoardBooks(body);
  _edgesCache[league] = state.book;
  _edgesCache[`${league}+props`] = state.book;
  return true;
}
function prefetchStaticLeagues(active) {
  if (!CBB_STATIC) return;
  const run = () => {
    // Warm props for the active league, then other league cores.
    ensurePropsLoaded().then((changed) => { if (changed) render(); }).catch(() => {});
    ["cbb", "cfb", "nfl", "nba"].filter((lg) => lg !== active).forEach((lg) => {
      fetchEdges(lg).catch(() => {});
    });
  };
  if (typeof requestIdleCallback === "function") requestIdleCallback(run, { timeout: 1800 });
  else setTimeout(run, 400);
}
async function load() {
  $("table").innerHTML = `<div class="empty">Loading the board…</div>`;
  clearBoxCache();
  const league = state.league || "cbb";
  const colorsUrl = CBB_STATIC ? `static/team_colors.json${assetV()}` : "/static/team_colors.json";
  // Parallel: colors are tiny and optional; don't block the board on them.
  const colorsP = fetch(colorsUrl)
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  try {
    // CBB/NBA are prop-first; NFL/CFB game lines are small enough to load with
    // props. Skipping props left CBB looking empty (game markets often absent).
    const needProps = true;
    const [colors, body] = await Promise.all([colorsP, fetchEdges(league, { withProps: needProps })]);
    TEAM_COLORS = colors || {};
    state.book = trimBoardBooks(body);
  } catch (err) {
    TEAM_COLORS = await colorsP;
    $("status").textContent = "Board failed to load. Pull to refresh.";
    $("table").innerHTML = `<div class="empty">Could not load odds for ${String(league).toUpperCase()}.</div>`;
    return;
  }
  const n = (state.book.rows || []).length;
  const tag = league === "all" ? "all leagues" : String(league).toUpperCase();
  $("status").textContent = state.book.error
    ? state.book.error
    : `${n} prices · ${(state.book.games || []).length} games · ${tag}`;
  render();
  prefetchStaticLeagues(league);
}

$("marketName").onchange = () => {
  // Stay on the active kind chip (Moneyline / Spread / Total / Player prop).
  state.marketName = $("marketName").value;
  if (!["ml", "spread", "total", "prop"].includes(state.market)) state.market = "spread";
  render();
};

async function applyBoard(body, tag) {
  state.book = trimBoardBooks(body || state.book);
  const n = ((state.book && state.book.rows) || []).length;
  const games = ((state.book && state.book.games) || []).length;
  const label = tag || (state.league === "all" ? "all leagues" : String(state.league || "cbb").toUpperCase());
  $("status").textContent = (state.book && state.book.error)
    ? state.book.error
    : `${n} prices · ${games} games · ${label}`;
  render();
}

async function softReload() {
  // Static Pages board is a snapshot — no live poll.
  if (CBB_STATIC) return;
  // Light poll only — never hit sync-injuries here. That path can resim the
  // whole NBA slate and freeze /api/desk/edges (GIL) until the page dies.
  try {
    const league = state.league || "cbb";
    delete _edgesCache[league];
    clearBoxCache();
    // Keep props on the board once they are open. A light poll used to
    // replace them with game lines and the prop view went empty.
    const keepProps = state.market === "prop" || !(state.book && state.book.props_pending);
    await applyBoard(await fetchEdges(league, { withProps: keepProps }));
  } catch (err) {
    /* keep last board */
  }
}

if (CBB_STATIC) {
  const refresh = $("refresh");
  if (refresh) refresh.remove();
} else if ($("refresh")) {
  $("refresh").onclick = async () => {
    $("refresh").disabled = true;
    $("refresh").textContent = "Refreshing…";
    $("status").textContent = "Injuries → resim tips → pulling books…";
    try {
      throw new Error("Live refresh runs on the local desk");
      const body = await response.json();
      await applyBoard(body);
    } catch (err) {
      $("status").textContent = "Refresh failed. The last board is still up.";
    } finally {
      $("refresh").disabled = false;
      $("refresh").textContent = "Refresh odds";
    }
  };
  // Every 2 minutes: cull live/final games and keep rail logos in sync.
  setInterval(softReload, 2 * 60 * 1000);
}
load();
</script>
</body>
</html>
